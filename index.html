成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若一個測試電荷同時受到多個源電荷作用，根據力的向量可疊加性，總力等於各來源造成的力向量相加。</li><li>除以相同的測試電荷 $q$，可把「力的疊加」轉寫成「電場的疊加」。</li><li>因此 $\\vec E_{\\rm net}=\\sum_i\\vec E_i$。</li><li>實際計算時必須做向量相加：大小不能直接相加，只有方向相同時才可以把純量大小直接相加。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"均勻電場與電位差","formula":"E=\\frac{|\\Delta V|}{d}","vars":"適用於均勻電場、沿場方向的距離。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對均勻電場，場強與電位的關係是一維直線變化；沿電場方向移動距離 $d$，電位下降量大小為 $Ed$。</li><li>因此電位差的絕對值與場強、距離成正比：$|\\Delta V|=Ed$。</li><li>整理得到卡片上的 $E=|\\Delta V|/d$。</li><li>若需要方向與正負號，就使用更完整的關係 $\\Delta V=-\\int\\vec E\\cdot d\\vec r$；卡片公式使用的是均勻電場中的大小關係。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電位定義","formula":"V=\\frac{U}{q}","vars":"單位電荷的電位能。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電位是一個位置的「每單位電荷電位能」。</li><li>若一個電荷 $q$ 在某位置具有電位能 $U$，就把每一庫侖對應的能量定義為電位。</li><li>因此 $V=U/q$。</li><li>電位是純量，所以多個電荷產生的電位可以直接做帶符號的代數相加；這點與向量性的電場不同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"點電荷電位","formula":"V=k\\frac{Q}{r}","vars":"以無限遠電位為零。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>點電荷產生的電場大小為 $E=k|Q|/r^2$，方向沿徑向。</li><li>以無限遠為電位零點，電位差由電場沿路徑積分得到：$V(r)-V(\\infty)=-\\int_\\infty^r\\vec E\\cdot d\\vec r$。</li><li>對點電荷的徑向場積分，得到大小與 $1/r$ 成正比，並保留源電荷正負號。</li><li>因此 $V=kQ/r$（以無限遠為零點）。正電荷在有限距離電位為正，負電荷則為負。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電位能","formula":"U=qV","vars":"電荷位於電位 $V$ 時的電位能。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電位定義為單位電荷的電位能：$V=U/q$。</li><li>兩邊同乘 $q$，得到 $U=qV$。</li><li>因此若知道某位置的電位，就可以直接算出把指定電荷放在該位置時的電位能。</li><li>注意電位是「空間本身」的量，而電位能是「電場＋指定電荷」組合後的能量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"兩點電荷電位能","formula":"U=k\\frac{q_1q_2}{r}","vars":"以無限遠位能為零。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>點電荷 $q_1$ 在距離 $r$ 處產生的電位為 $V_1=kq_1/r$（取無限遠為零）。</li><li>再把另一個電荷 $q_2$ 放到這個位置，依 $U=qV$，系統電位能為 $U=q_2V_1$。</li><li>代入得到 $U=q_2(kq_1/r)=kq_1q_2/r$。</li><li>正負號反映兩電荷是相吸還是相斥的能量結構；不是單純看電位能「大小」再補符號。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電位差與位能差","formula":"\\Delta V=\\frac{\\Delta U}{q}","vars":"由電位定義得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電位定義為 $V=U/q$，因此「每單位電荷的能量差」就是電位差。</li><li>兩個位置分別有電位能 $U_i,U_f$，固定電荷 $q$ 移動時，位能差為 $\\Delta U$。</li><li>所以 $\\Delta V=\\Delta U/q$。</li><li>這個式子也可寫成 $\\Delta U=q\\Delta V$，常用於計算帶電粒子在電位差中得到或失去的能量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電場與電位梯度","formula":"E_x=-\\frac{dV}{dx}","vars":"電場指向電位下降的方向。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電位的定義與保守力作功告訴我們，電場方向指向電位降低最快的方向。</li><li>一維沿 $x$ 軸取一小段位移 $dx$。電位能改變與電場力作功滿足 $dU=-qE_xdx$。</li><li>因 $V=U/q$，可得 $dV=-E_xdx$。</li><li>因此 $E_x=-dV/dx$。負號表示電場指向電位下降的方向；電位越陡峭地下降，電場越強。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>負號非常重要：電場方向永遠指向電位降低最快的方向。這就是為什麼正電荷自然沿著電場方向降低電位能，而負電荷則相反。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"均勻電場中的電位變化","formula":"\\Delta V=-Ed","vars":"沿電場方向移動距離 $d$ 時電位降低。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由一維關係 $E_x=-dV/dx$，若均勻電場表示 $E_x$ 為常數。</li><li>對距離積分：$\\Delta V=-\\int E_xdx=-E_xd$。</li><li>因此沿電場方向走距離 $d$，電位降低 $Ed$。</li><li>若只問大小，常寫成 $|\\Delta V|=Ed$；卡片這裡保留方向性的負號，因此 $\\Delta V=-Ed$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電流","formula":"I=\\frac{\\Delta Q}{\\Delta t}=\\frac{dQ}{dt}","vars":"單位時間通過截面的電荷量。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電流描述電荷通過某個截面的快慢。</li><li>在時間 $\\Delta t$ 內通過截面的淨電荷量為 $\\Delta Q$，平均電流就定義為 $\\Delta Q/\\Delta t$。</li><li>當時間間隔縮到零，就得到瞬時電流 $I=dQ/dt$。</li><li>因此 $I=\\Delta Q/\\Delta t=dQ/dt$ 同時包含平均形式與瞬時形式；正負號表示電流定義方向。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"漂移電流","formula":"I=nqAv_d","vars":"<b>$n$</b>：載子數密度 ｜ <b>$A$</b>：截面積 ｜ <b>$v_d$</b>：漂移速度","note":"由單位時間通過截面的載子數得到。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>設導體截面積為 $A$，自由載子數密度為 $n$，每個載子電量大小為 $q$，平均漂移速率為 $v_d$。</li><li>時間 $\\Delta t$ 內，平均移動距離為 $v_d\\Delta t$，因此通過截面的圓柱體積為 $Av_d\\Delta t$。</li><li>其中載子數為 $nAv_d\\Delta t$，總電荷量為 $q(nAv_d\\Delta t)$。</li><li>除以時間得到 $I=nqAv_d$。這個模型描述的是平均漂移速度很小、但載子數很多所形成的宏觀電流。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由單位時間通過截面的載子數得到。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"歐姆定律","formula":"V=IR","vars":"對歐姆性導體成立。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對許多金屬導體，在溫度等條件近似固定時，實驗顯示電流與電壓差成正比：$I\\propto V$。</li><li>把比例常數的倒數定義為電阻 $R$，因此 $V=IR$。</li><li>這條式子是描述「歐姆性元件」的特性，不是所有電子元件在所有條件下都嚴格遵守。</li><li>若畫 $V$-$I$ 圖，歐姆性元件在固定條件下會呈直線，斜率就是電阻 $R$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電阻與電阻率","formula":"R=\\rho\\frac{L}{A}","vars":"<b>$\\rho$</b>：電阻率","note":"均勻導線的幾何與材料關係。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對均勻導線，實驗上電阻與長度 $L$ 成正比：線越長，電荷遇到的散射機會越多。</li><li>電阻與截面積 $A$ 成反比：截面越大，同時可通過的載子路徑越多。</li><li>因此 $R\\propto L/A$，把只由材料與溫度等條件決定的比例常數定義為電阻率 $\\rho$。</li><li>得到 $R=\\rho L/A$。這是均勻、等截面導體的基本模型。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>均勻導線的幾何與材料關係。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電阻串聯","formula":"R_{\\rm eq}=R_1+R_2+\\cdots","vars":"串聯電流相同，電壓相加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>串聯電路中，所有元件位於同一條電流路徑，因此通過每個電阻的電流相同，記為 $I$。</li><li>整段電路的總電壓等於每個電阻電壓降之和：$V=V_1+V_2+\\cdots$。</li><li>對每個電阻套用歐姆定律 $V_i=IR_i$，因此 $V=I(R_1+R_2+\\cdots)$。</li><li>再與等效電阻定義 $V=IR_{\\rm eq}$ 比較，得到 $R_{\\rm eq}=R_1+R_2+\\cdots$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電阻並聯","formula":"\\frac1{R_{\\rm eq}}=\\frac1{R_1}+\\frac1{R_2}+\\cdots","vars":"並聯電壓相同，電流相加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>並聯元件兩端接在同一對節點，因此每個支路的電壓相同，都等於 $V$。</li><li>每個支路電流為 $I_i=V/R_i$，而節點定律要求總電流為各支路電流之和：$I=\\sum I_i$。</li><li>因此 $I=V(1/R_1+1/R_2+\\cdots)$。</li><li>又以等效電阻表示 $I=V/R_{\\rm eq}$，比較後得到 $1/R_{\\rm eq}=1/R_1+1/R_2+\\cdots$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"兩電阻並聯","formula":"R_{\\rm eq}=\\frac{R_1R_2}{R_1+R_2}","vars":"兩個電阻並聯的簡化式。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從並聯的一般關係開始：$1/R_{\\rm eq}=1/R_1+1/R_2$。</li><li>通分得到 $1/R_{\\rm eq}=(R_1+R_2)/(R_1R_2)$。</li><li>兩邊取倒數，得到 $R_{\\rm eq}=R_1R_2/(R_1+R_2)$。</li><li>可以立即檢查結果：兩個正電阻並聯後，等效電阻一定小於其中較小的那一個。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電功率","formula":"P=VI=I^2R=\\frac{V^2}{R}","vars":"由 $P=VI$ 與歐姆定律互換。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電功率定義為單位時間的電能轉移：$P=W/t$。</li><li>電位差 $V$ 的定義表示每單位電荷可交換的能量，而電流 $I=Q/t$ 表示單位時間通過的電荷。</li><li>因此每秒轉移的能量為「每庫侖能量 × 每秒庫侖數」：$P=VI$。</li><li>再利用歐姆定律 $V=IR$，可得到 $P=I^2R$；或用 $I=V/R$ 得 $P=V^2/R$。三個形式描述同一功率，只是已知量不同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div :text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電阻內部的電能最終可轉換成熱能。</li><li>一段時間內電阻消耗的電能為 $W=I^2Rt$，若全部以熱形式散出，就令產生熱量 $Q=W$。</li><li>因此 $Q=I^2Rt$。</li><li>也可以從 $Q=VIt$ 或 $P=VI$ 出發，再用歐姆定律得到相同結果；這三種寫法只是已知條件不同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電動勢","formula":"\\mathcal E=\\frac{W}{q}","vars":"<b>$\\mathcal E$</b>：電動勢","note":"每單位電荷由非靜電力來源得到的能量。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電動勢不是「電路裡的力」，而是電源在內部把其他形式的能量轉換成電荷電位能的能力尺度。</li><li>若電源透過非靜電力對電荷 $q$ 傳遞能量 $W$，則每單位電荷所得到的能量定義為電動勢。</li><li>因此 $\\mathcal E=W/q$。</li><li>單位仍是伏特，但概念上它描述的是電源提供能量的能力；端電壓則是外部電路中實際測得的電位差，兩者在有內阻時不必相同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>每單位電荷由非靜電力來源得到的能量。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電池端電壓","formula":"V_{\\rm terminal}=\\mathcal E-Ir","vars":"<b>$r$</b>：內電阻","note":"放電時扣除內阻電壓降。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>設電池的電動勢為 $\\mathcal E$，內部有內阻 $r$。放電時電流 $I$ 通過內阻，內部會消耗一部分電位差。</li><li>內阻上的電壓降依歐姆定律為 $Ir$。</li><li>因此外部端點真正得到的電壓就是電動勢扣掉內部壓降：$V_{\\rm terminal}=\\mathcal E-Ir$。</li><li>當 $I=0$（理想開路）時端電壓回到 $\\mathcal E$；電流越大，內阻造成的端電壓下降越明顯。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>放電時扣除內阻電壓降。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"含內電阻電路電流","formula":"I=\\frac{\\mathcal E}{R+r}","vars":"外阻與內阻串聯。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把電池電動勢 $\\mathcal E$ 看成整個電路可提供的推動電壓。外部電阻為 $R$，電池內阻為 $r$，兩者串聯於同一回路。</li><li>整個回路的總電阻為 $R+r$。依歐姆定律，電流大小滿足 $\\mathcal E=I(R+r)$。</li><li>解出電流：$I=\\mathcal E/(R+r)$。</li><li>這個結果也能由端電壓式代回外部負載：$V_{\\rm terminal}=IR$，與 $V_{\\rm terminal}=\\mathcal E-Ir$ 聯立得到。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"克希何夫節點定律","formula":"\\sum I_{\\rm in}=\\sum I_{\\rm out}","vars":"節點不會憑空累積電荷。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>節點定律源自電荷守恆：電荷不能在一個普通節點憑空產生或消失。</li><li>因此在穩態電路中，單位時間流入節點的總電荷量必須等於流出的總電荷量。</li><li>把單位時間的電荷流量寫成電流，就得到 $\\sum I_{\\rm in}=\\sum I_{\\rm out}$。</li><li>解題時可任意設定支路電流正方向；若算出的某個電流為負，代表真實方向與原先假設相反，而定律本身仍然成立。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>節點定律本質上是電荷守恆：穩態下節點不會持續累積電荷，所以流入電流總量必須等於流出電流總量。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"克希何夫迴路定律","formula":"\\sum\\Delta V=0","vars":"沿完整迴路回到原點，總電位變化為零。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>迴路定律源自能量守恆：電荷繞完整封閉回路一圈後，不能憑空獲得或失去淨能量。</li><li>沿回路行走時，經過電池會有電位上升，經過電阻等元件則有電位下降。</li><li>把整圈所有電位變化帶符號相加，回到原點後總電位改變必須是零。</li><li>因此 $\\sum\\Delta V=0$。實際套用時最重要的是固定繞行方向與正負號規則，逐元件記錄電位升降。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>迴路定律本質上是能量守恆：電荷繞完整一圈後回到原點，總位能變化必須為零，所以所有電位升降代數和為零。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電池串聯電動勢","formula":"\\mathcal E_{\\rm eq}=\\sum_i\\mathcal E_i","vars":"方向一致時電動勢代數相加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>串聯電池表示同一條電流路徑依序通過多個電源，因此每個電源造成的電位升降會沿回路累積。</li><li>若所有電池方向一致，它們提供的能量每庫侖都同向增加，因此電動勢直接相加。</li><li>所以 $\\mathcal E_{\\rm eq}=\\sum_i\\mathcal E_i$。</li><li>若某顆電池方向與其他顆相反，則在帶符號的回路方程中應以負號計入；這裡的簡式假設全部同向。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"長直導線磁場","formula":"B=\\frac{\\mu_0I}{2\\pi r}","vars":"距離導線越遠磁場越弱。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>載流長直導線周圍的磁場具有圓對稱性：在距離導線相同的圓周上，磁場大小相同，方向沿圓周切線。</li><li>利用安培定律 $\\oint\\vec B\\cdot d\\vec l=\\mu_0I$，選取半徑 $r$ 的圓形安培路徑。</li><li>因圓周上 $B$ 大小相同且與路徑切向平行，左邊變成 $B(2\\pi r)$。</li><li>因此 $B(2\\pi r)=\\mu_0I$，解得 $B=\\mu_0I/(2\\pi r)$。方向可由右手握拳定則判斷。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"圓形線圈中心磁場（單圈）","formula":"B=\\frac{\\mu_0I}{2R}","vars":"圓心處各電流元的磁場疊加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>一個圓形電流環在中心產生的磁場可以由畢奧—沙伐定律積分得到。</li><li>對圓周上的每一小段電流，因中心到各段的距離都相同，而且對稱性使垂直於線圈面的分量彼此相加、其他分量抵消。</li><li>對整個圓周積分後，中心磁場大小與電流 $I$ 成正比、與半徑 $R$ 成反比。</li><li>結果為 $B=\\mu_0I/(2R)$，方向由右手定則決定，沿線圈中心軸。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"圓形線圈中心磁場（$N$ 圈）","formula":"B=\\frac{\\mu_0NI}{2R}","vars":"多圈線圈磁場線性疊加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若 $N$ 圈線圈緊密重疊，且每一圈電流大小與幾何形狀相同，那麼每一圈在中心產生的磁場方向相同。</li><li>磁場滿足疊加原理，因此總磁場就是單圈磁場的 $N$ 倍。</li><li>單圈有 $B_1=\\mu_0I/(2R)$。</li><li>所以 $B=NB_1=\\mu_0NI/(2R)$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"長螺線管磁場","formula":"B=\\mu_0nI","vars":"<b>$n=N/L$</b>：單位長度匝數","note":"理想長螺線管內部近似均勻。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>長螺線管內部靠近中央區域的磁場近似均勻，外部磁場在理想模型中近似很小。</li><li>使用安培定律，選擇穿過管內的一條矩形安培路徑。只有管內的一段長度 $\\ell$ 對線積分有主要貢獻。</li><li>矩形路徑所包住的電流等於單位長度匝數 $n$ 乘長度 $\\ell$ 再乘每圈電流 $I$，即 $n\\ell I$。</li><li>因此 $B\\ell=\\mu_0n\\ell I$，得到 $B=\\mu_0nI$。這是長螺線管、密集繞線、遠離端點時的理想結果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>理想長螺線管內部近似均勻。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"長螺線管磁場（匝數形式）","formula":"B=\\mu_0\\frac NL I","vars":"將 $n=N/L$ 代入。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從長螺線管基本公式 $B=\\mu_0nI$ 出發。</li><li>若整條螺線管長度為 $L$、總匝數為 $N$，則每單位長度的匝數定義為 $n=N/L$。</li><li>代入得到 $B=\\mu_0(N/L)I$。</li><li>所以 $B=\\mu_0\\frac NL I$。這個形式在題目直接給總匝數與管長時較方便。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"載流導線受磁力","formula":"\\vec F=I\\vec L\\times\\vec B","vars":"磁力方向由叉積決定。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>磁場會對移動電荷施加洛倫茲磁力 $\\vec F=q\\vec v\\times\\vec B$。導線中的大量載流電荷共同受到這種力。</li><li>把一段長度向量 $\\vec L$ 的導線內所有載子受到的磁力做總和，電流 $I$ 把「每秒通過多少電荷」濃縮進來。</li><li>累加後可得到載流導線受到的磁力向量 $\\vec F=I\\vec L\\times\\vec B$。</li><li>叉積表示力同時垂直於電流方向與磁場方向；若導線與磁場平行，磁力為零。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"載流導線受磁力大小","formula":"F=ILB\\sin\\theta","vars":"由叉積大小得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由向量式 $\\vec F=I\\vec L\\times\\vec B$ 出發。</li><li>叉積大小公式為 $|\\vec L\\times\\vec B|=LB\\sin\\theta$。</li><li>因此 $F=ILB\\sin\\theta$。</li><li>當 $\\theta=90^\\circ$ 時磁力最大為 $ILB$；當平行時 $\\theta=0^\\circ$，磁力為零。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"兩平行載流導線間力","formula":"\\frac FL=\\frac{\\mu_0I_1I_2}{2\\pi r}","vars":"把一條導線的磁場代入另一條導線的受力式。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>第一條長直導線電流 $I_1$ 在距離 $r$ 處產生磁場 $B_1=\\mu_0I_1/(2\\pi r)$。</li><li>第二條導線電流為 $I_2$，若兩條平行且長度為 $L$，第二條導線受到的磁力大小為 $F=I_2LB_1$，因導線與磁場互相垂直。</li><li>代入 $B_1$ 得 $F=I_2L\\mu_0I_1/(2\\pi r)$。</li><li>除以長度 $L$，得到 $F/L=\\mu_0I_1I_2/(2\\pi r)$。同向電流互相吸引，反向電流互相排斥。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"洛倫茲力","formula":"\\vec F=q(\\vec E+\\vec v\\times\\vec B)","vars":"同時包含電場力與磁力。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>帶電粒子若只在電場中，受電力 $\\vec F_E=q\\vec E$；若只在磁場中並以速度 $\\vec v$ 運動，受磁力 $\\vec F_B=q\\vec v\\times\\vec B$。</li><li>當電場與磁場同時存在時，兩種力都同時作用。</li><li>依力的向量疊加原理，把兩者相加：$\\vec F=\\vec F_E+\\vec F_B$。</li><li>因此得到 $\\vec F=q(\\vec E+\\vec v\\times\\vec B)$，這就是洛倫茲力的完整形式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>電場力與磁力的角色不同：$q\u000bec E$ 可改變粒子的速率，而 $q\u000bec v\times\u000bec B$ 永遠垂直於速度，因此純磁場中的磁力通常改變方向而不直接改變速率。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"純磁場中的磁力大小","formula":"F=|q|vB\\sin\\theta","vars":"只有磁場作用時。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從洛倫茲力的磁力部分 $\\vec F_B=q\\vec v\\times\\vec B$ 出發。</li><li>叉積大小為 $|q|vB\\sin\\theta$，其中 $\\theta$ 是速度與磁場的夾角。</li><li>因此 $F=|q|vB\\sin\\theta$。</li><li>速度平行磁場時磁力為零；速度垂直磁場時磁力最大，且磁力永遠與速度垂直，因此理想純磁場不直接改變粒子速率，只改變運動方向。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"帶電粒子磁場圓周半徑","formula":"r=\\frac{mv}{|q|B}","vars":"當速度垂直磁場時，磁力提供向心力。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若帶電粒子速度完全垂直均勻磁場，磁力大小為 $F=|q|vB$。</li><li>磁力垂直速度，因此可以持續充當向心力，使粒子做等速圓周運動。</li><li>令 $|q|vB=mv^2/r$。</li><li>解得 $r=mv/(|q|B)$。可見動量越大或電荷量、磁場越小，圓軌道半徑越大。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"迴旋角頻率","formula":"\\omega_c=\\frac{|q|B}{m}","vars":"由圓周條件聯立得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由上一張公式 $r=mv/(|q|B)$，以及圓周運動關係 $v=r\\omega_c$。</li><li>把 $v=r\\omega_c$ 代入：$r=m(r\\omega_c)/(|q|B)$。</li><li>消去 $r$，得到 $\\omega_c=|q|B/m$。</li><li>因此在非相對論、均勻磁場中，迴旋角頻率與粒子速度無關，只與 $|q|/m$ 和磁場大小有關。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"迴旋週期","formula":"T=\\frac{2\\pi m}{|q|B}","vars":"由 $T=2\\pi/\\omega_c$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>圓周運動的週期與角速度關係為 $T=2\\pi/\\omega_c$。</li><li>代入 $\\omega_c=|q|B/m$。</li><li>得到 $T=2\\pi m/(|q|B)$。</li><li>因此速度增加雖然會讓軌道半徑變大，但在非相對論模型中週期仍保持不變，這是迴旋運動的重要特徵。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"迴旋頻率","formula":"f=\\frac{|q|B}{2\\pi m}","vars":"由 $f=1/T$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>頻率與週期互為倒數：$f=1/T$。</li><li>由迴旋週期 $T=2\\pi m/(|q|B)$ 出發。</li><li>取倒數得到 $f=|q|B/(2\\pi m)$。</li><li>也可直接由 $\\omega_c=2\\pi f$ 得到相同結果。這個頻率常稱迴旋頻率或回旋頻率。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"速度選擇器","formula":"qE=qvB\\quad\\Longrightarrow\\quad v=\\frac EB","vars":"電場力與磁力互相抵消時粒子不偏轉。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>帶電粒子同時進入互相垂直的電場與磁場。若電場力與磁力方向相反，就可能互相抵消。</li><li>電力大小為 $|q|E$；當粒子速度垂直磁場時，磁力大小為 $|q|vB$。</li><li>要求粒子不偏轉，即兩力大小相等：$qE=qvB$（符號方向由實際方向判定）。</li><li>消去電荷量，得到 $v=E/B$。因此只有特定速度的粒子可以直線通過速度選擇器。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"線圈磁矩","formula":"\\vec\\mu=NI\\vec A","vars":"<b>$A$</b>：線圈面積","note":"載流線圈可視為磁偶極。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>載流線圈會像一個小磁偶極，具有與電流方向及線圈面積有關的磁性。</li><li>單一圓形電流環的磁矩大小定義為 $\\mu=IA$；若有 $N$ 匝且各匝效果疊加，大小乘上 $N$。</li><li>方向沿線圈面的法線，由右手定則判斷。</li><li>因此向量形式為 $\\vec\\mu=NI\\vec A$，其中 $\\vec A$ 是具有方向的面積向量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>載流線圈可視為磁偶極。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"磁矩受力矩","formula":"\\vec\\tau=\\vec\\mu\\times\\vec B","vars":"大小為 $NIAB\\sin\theta$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>載流線圈的磁矩與外部磁場互相作用，會產生把磁矩方向轉向磁場方向的力矩。</li><li>對一個磁偶極，力矩大小與 $\\mu$、$B$ 以及兩者夾角的正弦成正比。</li><li>向量形式可寫成 $\\vec\\tau=\\vec\\mu\\times\\vec B$。</li><li>代入 $\\vec\\mu=NI\\vec A$ 可得大小 $\\tau=NIAB\\sin\\theta$。當磁矩與磁場平行時力矩為零；垂直時最大。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"磁通量","formula":"\\Phi_B=\\vec B\\cdot\\vec A=BA\\cos\\theta","vars":"衡量磁場穿過面的程度。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>磁通量衡量磁場穿過某一面積的程度；關鍵不只是磁場大小，還要看磁場有多少分量真正穿過該面。</li><li>平面面積向量 $\\vec A$ 的方向定義為面法線方向，因此磁場沿法線方向的分量為 $B\\cos\\theta$。</li><li>穿過面積的總效果為 $BA\\cos\\theta$，也就是向量內積 $\\vec B\\cdot\\vec A$。</li><li>因此 $\\Phi_B=\\vec B\\cdot\\vec A=BA\\cos\\theta$。當磁場平行於面時，$\\theta=90^\\circ$，磁通量為零。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"法拉第電磁感應定律","formula":"\\mathcal E=-N\\frac{\\Delta\\Phi_B}{\\Delta t}","vars":"負號代表冷次定律：阻礙磁通量變化。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>實驗顯示，線圈中的感應電動勢與穿過線圈的磁通量改變快慢成正比。</li><li>若單圈磁通量從 $\\Phi_1$ 變到 $\\Phi_2$，平均變化率為 $\\Delta\\Phi_B/\\Delta t$。</li><li>對 $N$ 匝線圈，每一匝的感應效果疊加，因此乘上 $N$。</li><li>得到 $\\mathcal E=-N\\Delta\\Phi_B/\\Delta t$。負號表示感應效應的方向總是反抗造成它的磁通量變化，這就是冷次定律。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>感應電動勢取決於「磁通量改變多快」，不是單純取決於磁場有多大。磁通量可以因 $B$、面積 $A$ 或線圈方向改變而改變。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"法拉第定律（瞬時）","formula":"\\mathcal E=-N\\frac{d\\Phi_B}{dt}","vars":"平均變化率的極限形式。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>平均法拉第定律為 $\\mathcal E=-N\\Delta\\Phi_B/\\Delta t$。</li><li>若磁通量隨時間連續改變，將時間區間縮到零，就把平均變化率改寫成導數。</li><li>因此 $\\mathcal E=-N\\,d\\Phi_B/dt$。</li><li>瞬時形式能處理旋轉線圈、變動磁場等感應電動勢隨時間改變的情況。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"動生電動勢","formula":"\\mathcal E=BLv","vars":"典型導體棒且 $v\\perp B$ 時。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>一根長度 $L$ 的導體棒以速度 $v$ 穿過均勻磁場時，導體內自由電荷受到磁力 $q\\vec v\\times\\vec B$，使正負電荷分離。</li><li>當棒內部的電場力逐漸建立，直到電力與磁力平衡時，沿棒兩端形成穩定電位差。</li><li>若棒、速度、磁場三者互相垂直，磁力每單位電荷所造成的電位差大小可得 $\\mathcal E=BLv$。</li><li>更一般地可寫成與 $\\vec v\\times\\vec B$ 在導體方向上的分量有關；卡片公式是最常用的垂直幾何特例。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"感應電流","formula":"I=\\frac{\\mathcal E}{R}","vars":"簡單閉合電路套用歐姆定律。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>法拉第定律先告訴我們感應電動勢 $\\mathcal E$；若外部形成閉合電路，這個電動勢會驅動電流。</li><li>對簡單電阻電路，直接使用歐姆定律 $V=IR$，把電壓 $V$ 換成感應電動勢 $\\mathcal E$。</li><li>得到 $I=\\mathcal E/R$。</li><li>實際若電路有內阻、電感或其他元件，就不能只用這個最簡形式，而要把整個電路的阻抗或回路方程納入。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"交流發電機磁通量","formula":"\\Phi=BA\\cos\\omega t","vars":"線圈以角速度 $\\omega$ 旋轉。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>發電機線圈面積法線與均勻磁場夾角隨時間改變。若線圈以角速度 $\\omega$ 均勻轉動，就有 $\\theta=\\omega t$（選擇初相位為零）。</li><li>磁通量定義為 $\\Phi=BA\\cos\\theta$。</li><li>代入 $\\theta=\\omega t$，得到 $\\Phi=BA\\cos\\omega t$。</li><li>因此機械旋轉造成磁通量週期性變化，接下來用法拉第定律就會產生正弦形式的交流電動勢。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"交流發電機感應電動勢","formula":"\\mathcal E=NBA\\omega\\sin\\omega t","vars":"對磁通量微分並乘匝數。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從磁通量 $\\Phi=BA\\cos\\omega t$ 出發。</li><li>依瞬時法拉第定律，$\\mathcal E=-N\\,d\\Phi/dt$。</li><li>對時間微分：$d(BA\\cos\\omega t)/dt=-BA\\omega\\sin\\omega t$。</li><li>乘上 $-N$ 後得到 $\\mathcal E=NBA\\omega\\sin\\omega t$。負號與微分的負號互相抵消，實際正負仍取決於你對線圈正方向與旋轉方向的定義。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"交流發電機最大電動勢","formula":"\\mathcal E_{\\max}=NBA\\omega","vars":"取正弦因子的最大值。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由交流發電機的瞬時電動勢 $\\mathcal E=NBA\\omega\\sin\\omega t$。</li><li>正弦函數的最大絕對值為 $1$。</li><li>因此電動勢最大值為 $\\mathcal E_{\\max}=NBA\\omega$。</li><li>所以增加匝數、面積、磁場或轉速都會提高理想發電機的感應電動勢振幅。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"理想變壓器電壓比","formula":"\\frac{V_s}{V_p}=\\frac{N_s}{N_p}","vars":"感應電壓與匝數成正比。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>交流電壓加在線圈上會造成變動磁通量；同一個鐵心中的主磁通近似同時穿過初級與次級。</li><li>依法拉第定律，每匝產生的感應電動勢與磁通量變化率相同，因此總電壓與匝數成正比。</li><li>所以 $V_p/N_p=V_s/N_s$。</li><li>整理得到 $V_s/V_p=N_s/N_p$。這是理想變壓器關係，假設漏磁、線圈電阻與鐵心損耗可忽略。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"理想變壓器功率守恆","formula":"V_pI_p=V_sI_s","vars":"忽略損耗。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>理想變壓器不把能量大量轉成熱或磁滯損耗，因此輸入端提供的功率等於輸出端得到的功率。</li><li>交流情況下若使用相同的有效值表示，輸入功率與輸出功率可寫成 $P_p=V_pI_p$、$P_s=V_sI_s$。</li><li>令兩者相等：$V_pI_p=V_sI_s$。</li><li>這與電壓比聯立後，立刻得到電流比反向於匝數比；因此升壓時理想電流下降，降壓時電流上升。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"理想變壓器電流比","formula":"\\frac{I_s}{I_p}=\\frac{N_p}{N_s}","vars":"由功率守恆與電壓比聯立。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從理想變壓器電壓比 $V_s/V_p=N_s/N_p$ 出發。</li><li>又有理想功率守恆 $V_pI_p=V_sI_s$，所以 $I_s/I_p=V_p/V_s$。</li><li>取電壓比的倒數：$V_p/V_s=N_p/N_s$。</li><li>因此得到 $I_s/I_p=N_p/N_s$。這反映理想變壓器中的能量守恆。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"真空中的電磁波速","formula":"c=\\frac{1}{\\sqrt{\\mu_0\\varepsilon_0}}","vars":"Maxwell 理論的真空波速。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>Maxwell 理論把電場與磁場的變化彼此耦合，最後可以得到在真空中傳播的波動方程。</li><li>該波動方程中的波速由真空介電常數 $\\varepsilon_0$ 與真空磁導率 $\\mu_0$ 決定。</li><li>與一般波動方程比較，可得到 $c^2=1/(\\mu_0\\varepsilon_0)$。</li><li>因此 $c=1/\\sqrt{\\mu_0\\varepsilon_0}$。這個結果把光與電磁場統一起來：光本身就是電磁波。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"電磁波波速","formula":"c=f\\lambda","vars":"一般波速關係。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>週期波的基本關係是「一個週期前進一個波長」，所以 $v=\\lambda/T$。</li><li>利用 $f=1/T$，可寫成 $v=f\\lambda$。</li><li>在真空中電磁波速就是 $c$，因此對真空中的電磁波得到 $c=f\\lambda$。</li><li>不同頻率的電磁波在真空中仍具有相同波速，因此頻率改變時波長必須反向改變。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"magnetic","label":"電磁學","title":"電磁波電場與磁場","formula":"E=cB","vars":"真空平面電磁波振幅關係。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電磁學中的方向非常重要。除了代入大小公式，也要注意叉積、右手定則、磁通量的夾角定義，以及感應定律中的負號所代表的冷次定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在真空中的平面電磁波中，電場、磁場與傳播方向彼此互相垂直。</li><li>Maxwell 方程組給出的波動解要求電場與磁場振幅之間存在固定比例。</li><li>將場方程與波速 $c$ 的關係代入，可得到 $E/B=c$。</li><li>因此 $E=cB$。這裡的 $E$、$B$ 指的是電磁波場的振幅大小，並以真空平面波為適用情況。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意夾角是線圈面法線與磁場、或速度與磁場之間的夾角，視公式而定；向量方向要配合右手定則判斷。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"光子能量","formula":"E=hf","vars":"單一光子的量子化能量。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>Planck 假設電磁輻射的能量不是連續任意取值，而是以量子形式交換。</li><li>每一個光子的能量與其頻率成正比，比例常數就是普朗克常數 $h$。</li><li>因此單一光子的能量為 $E=hf$。</li><li>光強增大主要表示單位時間通過的光子數增多，不是把單一光子的能量直接變大；單一光子的能量由頻率決定。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"光子能量與波長","formula":"E=\\frac{hc}{\\lambda}","vars":"由 $f=c/\\lambda$ 得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由量子化關係 $E=hf$ 出發。</li><li>光在真空中的頻率與波長滿足 $c=f\\lambda$，所以 $f=c/\\lambda$。</li><li>將其代入光子能量：$E=h(c/\\lambda)$。</li><li>得到 $E=hc/\\lambda$。因此波長越短，單一光子的能量越高。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"光子動量","formula":"p=\\frac Ec","vars":"光子的能量與動量關係。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>光子沒有靜止質量，但仍攜帶動量。對真空中的光子，能量與動量滿足 $E=pc$。</li><li>因此把兩邊除以 $c$，得到 $p=E/c$。</li><li>這個關係可以與 $E=hf$ 以及 $c=f\\lambda$ 聯立，進一步得到 $p=h/\\lambda$。</li><li>所以光的粒子性同時反映在離散能量與動量上。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"光子動量與波長","formula":"p=\\frac h\\lambda","vars":"由 $E=hf$ 與 $E=pc$ 聯立。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從 $p=E/c$ 出發，光子能量為 $E=hf$。</li><li>因此 $p=hf/c$。</li><li>又由 $c=f\\lambda$ 得 $f/c=1/\\lambda$。</li><li>所以 $p=h/\\lambda$。這條式子是後來德布羅意物質波假說的重要靈感來源。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"普朗克量子化","formula":"E=nhf","vars":"$n=1,2,3,\\ldots$","note":"能量以離散量子出現。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>量子化的意思是某些物理系統的能量交換只能以離散單位發生，而不是任意連續。</li><li>對頻率為 $f$ 的輻射，一個量子的能量是 $hf$。</li><li>如果系統交換 $n$ 個這樣的量子，就得到總能量 $E=nhf$，其中 $n$ 是非負整數或適用模型中的整數量子數。</li><li>因此 $E=nhf$ 是把「一個量子」的能量擴展成 $n$ 個量子的總能量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>能量以離散量子出現。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"愛因斯坦光電方程","formula":"hf=\\phi+K_{\\max}","vars":"<b>$\\phi$</b>：功函數 ｜ <b>$K_{\\max}$</b>：最大初動能","note":"光子能量分成克服功函數與電子動能。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>光電效應中，一個光子把能量 $hf$ 帶給一個電子。</li><li>電子要離開金屬表面，首先必須付出功函數 $\\phi$；剩下的能量才能變成電子離開金屬後的動能。</li><li>對最大初動能的電子，能量守恆給 $hf=\\phi+K_{\\max}$。</li><li>因此公式不是經驗上硬背的三項相加，而是一次能量帳本：輸入光子能量 = 克服束縛的能量 + 電子最後保留下來的最大動能。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 ga
