    <script>
        const FORMULAS = [{"cat":"measurement","label":"測量與不確定度","title":"算術平均值","formula":"\\bar{x}=\\frac{1}{N}\\sum_{i=1}^{N}x_i","vars":"<b>$\\bar{x}$</b>：平均值 ｜ <b>$N$</b>：測量次數 ｜ <b>$x_i$</b>：第 $i$ 次測量值","note":"多次測量取算術平均。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把同一物理量重複測量得到 $x_1,x_2,\\ldots,x_N$。若沒有理由認為某一次測量特別可靠，就讓每一次測量對結果具有相同權重。</li><li>算術平均值的核心定義就是「所有測量值的總和，除以測量次數」，因此總和為 $\\sum_{i=1}^{N}x_i$。</li><li>把總和除以 $N$，得到 $\\bar{x}=\\frac{1}{N}\\sum_{i=1}^{N}x_i$。</li><li>這個結果代表重複測量的中心位置；它不是把每次測量「變得正確」，而是利用多次測量來降低隨機波動對結果的影響。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>多次測量取算術平均。</div></div></div>"},{"cat":"measurement","label":"測量與不確定度","title":"樣本標準差","formula":"s=\\sqrt{\\frac{1}{N-1}\\sum_{i=1}^{N}(x_i-\\bar{x})^2}","vars":"<b>$s$</b>：樣本標準差","note":"衡量重複測量值的離散程度。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>先用 $\\bar{x}$ 找出資料的中心，再考慮每個測量值與中心的偏離量 $x_i-\\bar{x}$。</li><li>因為偏離量有正有負，若直接相加會互相抵消，所以先平方成 $(x_i-\\bar{x})^2$，使每個偏離都以非負的大小計入。</li><li>把所有平方偏差相加：$\\sum_{i=1}^{N}(x_i-\\bar{x})^2$。對樣本資料，要用自由度 $N-1$ 做平均，因此得到樣本變異數 $s^2=\\frac{1}{N-1}\\sum (x_i-\\bar{x})^2$。</li><li>最後開平方把量綱從「原量的平方」恢復成原量，得到 $s=\\sqrt{\\frac{1}{N-1}\\sum (x_i-\\bar{x})^2}$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>衡量重複測量值的離散程度。</div></div></div>"},{"cat":"measurement","label":"測量與不確定度","title":"母體標準差","formula":"\\sigma=\\sqrt{\\frac{1}{N}\\sum_{i=1}^{N}(x_i-\\mu)^2}","vars":"<b>$\\sigma$</b>：母體標準差 ｜ <b>$\\mu$</b>：母體平均值","note":"完整母體資料常用此定義。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若我們掌握的是完整母體，而不是從母體抽出的樣本，就直接用母體平均值 $\\mu$ 當中心。</li><li>每筆資料偏離平均值的程度為 $x_i-\\mu$；為避免正負抵消，將偏差平方。</li><li>完整母體的平方偏差平均為 $\\sigma^2=\\frac{1}{N}\\sum_{i=1}^{N}(x_i-\\mu)^2$。</li><li>再開平方得到標準差 $\\sigma=\\sqrt{\\frac{1}{N}\\sum_{i=1}^{N}(x_i-\\mu)^2}$。與樣本標準差相比，這裡分母是 $N$，因為母體平均值 $\\mu$ 本身已知。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>完整母體資料常用此定義。</div></div></div>"},{"cat":"measurement","label":"測量與不確定度","title":"平均值的標準不確定度","formula":"u_{\\bar{x}}=\\frac{s}{\\sqrt{N}}","vars":"<b>$u_{\\bar{x}}$</b>：平均值不確定度","note":"重複測量平均後，統計波動會下降。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若單次測量的隨機波動尺度以樣本標準差 $s$ 表示，平均 $N$ 次後，希望描述的是「平均值本身」的波動，而不是單次測量的波動。</li><li>對彼此獨立、具有相近統計性質的測量，$N$ 次平均會讓變異數縮小成原來的 $1/N$，也就是 $\\operatorname{Var}(\\bar{x})\\approx s^2/N$。</li><li>標準不確定度是變異數開根號，因此 $u_{\\bar{x}}=\\sqrt{s^2/N}=s/\\sqrt N$。</li><li>所以增加測量次數可以降低隨機不確定度，但改善速度只有平方根關係：測量次數增加四倍，不確定度才約減半。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>重複測量平均後，統計波動會下降。</div></div></div>"},{"cat":"measurement","label":"測量與不確定度","title":"獨立不確定度合成","formula":"u_z=\\sqrt{u_x^2+u_y^2}","vars":"<b>$u_x,u_y$</b>：獨立不確定度","note":"獨立誤差以平方和開根號合成。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類先從「測量結果如何描述」出發：有些式子是統計定義，有些則來自不確定度的傳播與獨立性假設。閱讀時要分清楚「定義」與「由假設推導出的近似式」。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>假設結果 $z$ 同時受到兩個彼此獨立的不確定來源 $u_x$ 與 $u_y$ 影響。</li><li>獨立的隨機偏差可能一正一負，不能直接把大小相加；正確做法是在「變異數」層級相加。</li><li>因此合成變異量為 $u_z^2=u_x^2+u_y^2$。</li><li>對兩邊開平方，得到 $u_z=\\sqrt{u_x^2+u_y^2}$。這就是平方和開根號（RSS）的基本形式，前提是兩項可視為獨立。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>獨立誤差以平方和開根號合成。</div></div></div>"},{"cat":"measurement","label":"測量與不確定度","title":"乘冪形式的不確定度傳播","formula":"z=x^a y^b,\\quad\\left(\\frac{u_z}{z}\\right)^2=a^2\\left(\\frac{u_x}{x}\\right)^2+b^2\\left(\\frac{u_y}{y}\\right)^2","vars":"<b>$u_z$</b>：$z$ 的不確定度","note":"相對不確定度的一階近似傳播。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類先從「測量結果如何描述」出發：有些式子是統計定義，有些則來自不確定度的傳播與獨立性假設。閱讀時要分清楚「定義」與「由假設推導出的近似式」。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從 $z=x^a y^b$ 開始。對小的不確定度，使用一階近似，把 $z$ 的小變化寫成 $dz\\approx\\frac{\\partial z}{\\partial x}dx+\\frac{\\partial z}{\\partial y}dy$。</li><li>計算偏導數：$\\frac{\\partial z}{\\partial x}=a x^{a-1}y^b=\\frac{az}{x}$，以及 $\\frac{\\partial z}{\\partial y}=b x^ay^{b-1}=\\frac{bz}{y}$。</li><li>因此相對變化量近似為 $\\frac{dz}{z}\\approx a\\frac{dx}{x}+b\\frac{dy}{y}$。</li><li>若 $x,y$ 的不確定度彼此獨立，就對相對不確定度的平方做合成，得到 $\\left(\\frac{u_z}{z}\\right)^2=a^2\\left(\\frac{u_x}{x}\\right)^2+b^2\\left(\\frac{u_y}{y}\\right)^2$。這是小不確定度的一階傳播公式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>相對不確定度的一階近似傳播。</div></div></div>"},{"cat":"measurement","label":"測量與不確定度","title":"百分比誤差","formula":"\\%\\text{ error}=\\frac{|\\text{實驗值}-\\text{理論值}|}{|\\text{理論值}|}\\times100\\%","vars":"比較實驗值與參考值的差異。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類先從「測量結果如何描述」出發：有些式子是統計定義，有些則來自不確定度的傳播與獨立性假設。閱讀時要分清楚「定義」與「由假設推導出的近似式」。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>先決定比較基準。若理論值或公認值是參考量，那麼實驗值與理論值的差為 $\\text{實驗值}-\\text{理論值}$。</li><li>用絕對值 $|\\text{實驗值}-\\text{理論值}|$ 只描述差距大小，不讓「高估」與「低估」在百分比誤差中互相抵消。</li><li>把這個差距除以理論值的絕對值，得到相對誤差：$\\frac{|\\text{實驗值}-\\text{理論值}|}{|\\text{理論值}|}$。</li><li>最後乘上 $100\\%$，把無因次比例改寫成百分比。它描述的是「相對於參考值，實驗結果差了多少」。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>使用前要確認資料的統計性質與不確定度模型；統計公式通常描述隨機誤差，不能自動消除系統誤差。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"平均速率","formula":"\\bar v_{\\rm speed}=\\frac{\\text{總路程}}{\\Delta t}","vars":"<b>$\\bar v_{\\rm speed}$</b>：平均速率","note":"使用總路程而非位移。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>速率是「走了多長的路，花了多少時間」；這裡使用的是標量，因此只關心路程，不關心最後往哪裡。</li><li>在一段時間 $\\Delta t$ 內，總路程記為 $s_{\\rm total}$。依平均速率的定義，$\\bar v_{\\rm speed}=s_{\\rm total}/\\Delta t$。</li><li>因此得到 $\\bar v_{\\rm speed}=\\frac{\\text{總路程}}{\\Delta t}$。</li><li>例如物體先前進再後退，路程仍然累加；這也是平均速率與平均速度最重要的差別。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>使用總路程而非位移。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"平均速度","formula":"\\vec v_{\\rm avg}=\\frac{\\Delta\\vec r}{\\Delta t}","vars":"<b>$\\Delta\\vec r$</b>：位移","note":"位移除以經過時間。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>速度是向量，所以不能只看走了多少路，還要看位置改變的方向。</li><li>在一段時間 $\\Delta t$ 中，位置向量從 $\\vec r_i$ 變成 $\\vec r_f$，因此位移為 $\\Delta\\vec r=\\vec r_f-\\vec r_i$。</li><li>按照「平均速度＝單位時間內位移的改變量」的定義，得到 $\\vec v_{\\rm avg}=\\frac{\\Delta\\vec r}{\\Delta t}$。</li><li>因為使用的是位移，所以繞一圈回到原點時位移可能為零，即使實際走過很長的路。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>位移除以經過時間。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"瞬時速度","formula":"\\vec v=\\frac{d\\vec r}{dt}","vars":"<b>$\\vec r$</b>：位置向量","note":"平均速度取時間間隔趨近零。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>平均速度只告訴我們一整段時間的平均變化率；要知道某一瞬間「此刻」的運動狀態，就要把時間區間縮得越來越短。</li><li>從平均速度 $\\frac{\\Delta\\vec r}{\\Delta t}$ 出發，令時間間隔 $\\Delta t\\to0$，位移區間也同時縮小。</li><li>這個極限就是位置對時間的導數：$\\vec v=\\lim_{\\Delta t\\to0}\\frac{\\Delta\\vec r}{\\Delta t}=\\frac{d\\vec r}{dt}$。</li><li>因此瞬時速度不是另一個獨立的物理量，而是平均速度在時間區間趨近零時的極限。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>平均速度取時間間隔趨近零。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"平均加速度","formula":"\\vec a_{\\rm avg}=\\frac{\\Delta\\vec v}{\\Delta t}","vars":"<b>$\\Delta\\vec v$</b>：速度變化量","note":"速度向量的平均變化率。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>加速度描述的不是「有多快」，而是速度向量改變得有多快。</li><li>若速度從 $\\vec v_i$ 變成 $\\vec v_f$，速度變化量為 $\\Delta\\vec v=\\vec v_f-\\vec v_i$。</li><li>把速度變化量除以造成這個變化的時間 $\\Delta t$，依平均變化率的定義得到 $\\vec a_{\\rm avg}=\\frac{\\Delta\\vec v}{\\Delta t}$。</li><li>因為速度是向量，即使速率不變，只要方向改變，$\\Delta\\vec v$ 仍可能不為零，因此仍可能有加速度。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>速度向量的平均變化率。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"瞬時加速度","formula":"\\vec a=\\frac{d\\vec v}{dt}=\\frac{d^2\\vec r}{dt^2}","vars":"速度對時間的導數。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從平均加速度 $\\frac{\\Delta\\vec v}{\\Delta t}$ 出發，把觀察時間縮到無限小。</li><li>令 $\\Delta t\\to0$，得到瞬時加速度 $\\vec a=\\lim_{\\Delta t\\to0}\\frac{\\Delta\\vec v}{\\Delta t}=\\frac{d\\vec v}{dt}$。</li><li>又因為 $\\vec v=\\frac{d\\vec r}{dt}$，再對時間微分一次，就得到 $\\vec a=\\frac{d^2\\vec r}{dt^2}$。</li><li>所以位置、速度、加速度形成連續關係：$\\vec r\\xrightarrow{d/dt}\\vec v\\xrightarrow{d/dt}\\vec a$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"等加速度速度公式","formula":"v=v_0+at","vars":"<b>$v$</b>：末速度 ｜ <b>$v_0$</b>：初速度 ｜ <b>$a$</b>：加速度 ｜ <b>$t$</b>：時間","note":"適用於加速度為常數。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由加速度定義，在一維且加速度為常數 $a$ 時，$a=\\frac{v-v_0}{t}$。</li><li>兩邊乘上 $t$，得到速度變化量 $v-v_0=at$。</li><li>把初速度 $v_0$ 移到右邊，得到 $v=v_0+at$。</li><li>這條式子的物理意思是：每經過一秒，速度固定增加 $a$；所以速度—時間圖是一條斜率為 $a$ 的直線。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>關鍵並不是把公式當成孤立結果，而是把「加速度＝速度的時間變化率」與「加速度為常數」兩件事同時使用。若 $a$ 改變，這個簡潔的一次式就不能直接套用。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>適用於加速度為常數。</div></div></div>","demo":"car"},{"cat":"motion","label":"直線與圓周運動","title":"等加速度位移公式","formula":"x=v_0t+\\frac12at^2","vars":"<b>$x$</b>：位移","note":"以 $x_0=0$；一般式為 $x=x_0+v_0t+\frac12at^2$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在等加速度運動中，速度從 $v_0$ 線性變化到 $v=v_0+at$。</li><li>位移等於速度—時間圖在時間區間內的代數面積。矩形部分為 $v_0t$。</li><li>速度增加的部分形成三角形，其高為 $at$、底為 $t$，面積為 $\\frac12(at)t=\\frac12at^2$。</li><li>兩部分相加：$x-x_0=v_0t+\\frac12at^2$。若取 $x_0=0$，就得到程式卡片上的 $x=v_0t+\\frac12at^2$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這個式子等價於對速度函數 $v(t)=v_0+at$ 做時間積分：$x-x_0=\\int_0^t v(t)dt$。因此它也可以從「速度—時間圖面積代表位移」理解。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>以 $x_0=0$；一般式為 $x=x_0+v_0t+\frac12at^2$。</div></div></div>","demo":"vt"},{"cat":"motion","label":"直線與圓周運動","title":"等加速度無時間公式","formula":"v^2=v_0^2+2a(x-x_0)","vars":"<b>$x-x_0$</b>：位移","note":"消去時間後的運動學關係。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由 $v=v_0+at$ 可得 $t=\\frac{v-v_0}{a}$，但我們希望消掉時間。</li><li>利用等加速度運動的另一關係 $x-x_0=\\frac{v+v_0}{2}t$。</li><li>把 $t=\\frac{v-v_0}{a}$ 代入：$x-x_0=\\frac{v+v_0}{2}\\frac{v-v_0}{a}$。</li><li>利用平方差 $(v+v_0)(v-v_0)=v^2-v_0^2$，整理成 $2a(x-x_0)=v^2-v_0^2$，因此 $v^2=v_0^2+2a(x-x_0)$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>它的價值在於把時間這個未知量消掉，直接連接「速度改變」與「位移」。這也是處理只給高度、速度或距離而沒給時間的題目時最自然的工具。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>消去時間後的運動學關係。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"等加速度平均速度","formula":"\\bar v=\\frac{v_0+v}{2}","vars":"速度隨時間線性變化，因此平均值為首尾平均。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>等加速度代表速度對時間是一次函數，因此 $v(t)$ 在 $v_0$ 與 $v$ 之間以直線方式變化。</li><li>平均速度可由 $v$-$t$ 圖下方面積除以時間得到。這個圖形是梯形，面積為 $\\frac{v_0+v}{2}t$。</li><li>再除以時間 $t$，得到 $\\bar v=\\frac{v_0+v}{2}$。</li><li>所以「首尾平均」只在速度隨時間線性變化，也就是等加速度條件下成立，不能任意套用到非等加速度運動。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"等加速度另一位移公式","formula":"x-x_0=\\frac{v+v_0}{2}t","vars":"由平均速度乘時間得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>位移可以寫成「平均速度 × 經過時間」。</li><li>等加速度時平均速度為 $\\bar v=\\frac{v_0+v}{2}$。</li><li>因此 $x-x_0=\\bar vt=\\frac{v_0+v}{2}t$。</li><li>這個式子與 $x-x_0=v_0t+\\frac12at^2$ 並非兩個獨立定律，而是同一個等加速度運動結構的兩種表示方式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"自由落體速度","formula":"v=v_0+gt","vars":"<b>$g$</b>：重力加速度","note":"取向下為正時 $a=g$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>理想自由落體指只考慮重力，忽略空氣阻力；在地表附近可近似認為重力加速度大小為常數 $g$。</li><li>若取向下為正方向，則加速度 $a=g$。把 $a=g$ 代入等加速度速度公式 $v=v_0+at$。</li><li>得到 $v=v_0+gt$。</li><li>若取向上為正，則應使用 $a=-g$；所以符號取決於座標方向，而不是公式本身改變。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>取向下為正時 $a=g$。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"自由落體位移","formula":"\\Delta y=v_0t+\\frac12gt^2","vars":"由等加速度位移式令 $a=g$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>自由落體在地表附近可視為等加速度運動，若取向下為正，則 $a=g$。</li><li>從一般等加速度位移式 $\\Delta y=v_0t+\\frac12at^2$ 出發。</li><li>代入 $a=g$，得到 $\\Delta y=v_0t+\\frac12gt^2$。</li><li>由靜止釋放時再令 $v_0=0$，就會退化成 $h=\\frac12gt^2$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"自由落體無時間公式","formula":"v^2=v_0^2+2g\\Delta y","vars":"由等加速度無時間式令 $a=g$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>自由落體只是在等加速度無時間式 $v^2=v_0^2+2a\\Delta x$ 中把加速度換成重力加速度。</li><li>若取向下為正，$a=g$，而位移寫成 $\\Delta y$。</li><li>代入即得 $v^2=v_0^2+2g\\Delta y$。</li><li>它特別方便用在不知道落下時間、只知道高度與速度的問題。若座標向上，應同時依符號規則處理 $g$ 與位移。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"自由落下（由靜止）速度","formula":"v=gt","vars":"$v_0=0$","note":"由靜止開始落下。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>「由靜止落下」就是初速度 $v_0=0$。</li><li>從自由落體速度式 $v=v_0+gt$ 出發，代入 $v_0=0$。</li><li>因此得到 $v=gt$。</li><li>這表示在理想自由落體中，速度大小會隨時間線性增加；每經過相同時間，速度增加相同的量 $g\\Delta t$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由靜止開始落下。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"自由落下（由靜止）高度","formula":"h=\\frac12gt^2","vars":"$v_0=0$","note":"由靜止開始落下。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>同樣從一般自由落體位移 $\\Delta y=v_0t+\\frac12gt^2$ 出發。</li><li>由靜止釋放，所以 $v_0=0$；因此第一項消失。</li><li>若把向下位移的大小記作高度 $h$，得到 $h=\\frac12gt^2$。</li><li>因此距離與時間的關係不是線性的，而是與 $t^2$ 成正比；例如時間變成兩倍，高度會變成四倍。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由靜止開始落下。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"自由落下（由靜止）速度高度關係","formula":"v^2=2gh","vars":"消去時間得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由靜止自由落下時，$v_0=0$。</li><li>把 $v_0=0$ 代入自由落體無時間式 $v^2=v_0^2+2gh$。</li><li>得到 $v^2=2gh$。</li><li>這也可以由 $v=gt$ 與 $h=\\frac12gt^2$ 聯立消去 $t$ 驗證：$v^2=g^2t^2=2gh$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"鉛直上拋上升時間","formula":"t_{\\rm up}=\\frac{v_0}{g}","vars":"<b>$t_{\\rm up}$</b>：到最高點時間","note":"最高點 $v=0$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>取向上為正，鉛直上拋只受重力，所以加速度為 $-g$。</li><li>速度隨時間為 $v=v_0-gt$。</li><li>到達最高點的瞬間，鉛直速度剛好降為零，因此令 $v=0$。</li><li>得到 $0=v_0-gt_{\\rm up}$，所以 $t_{\\rm up}=\\frac{v_0}{g}$。這只描述上升段；若落到另一個高度，總時間不一定是簡單的兩倍。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>最高點 $v=0$。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"鉛直上拋最大高度","formula":"h_{\\max}=\\frac{v_0^2}{2g}","vars":"最高點 $v=0$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>取拋出點為位移零、向上為正，在最高點 $v=0$。</li><li>使用等加速度無時間式 $v^2=v_0^2+2a\\Delta y$，並代入 $a=-g$。</li><li>得到 $0=v_0^2-2gh_{\\max}$。</li><li>整理得 $h_{\\max}=\\frac{v_0^2}{2g}$。也可以把 $t_{\\rm up}=v_0/g$ 代入位置式得到相同結果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"鉛直上拋總飛行時間","formula":"t_{\\rm total}=\\frac{2v_0}{g}","vars":"回到與拋出點相同高度時。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>這個公式限定物體最後回到與拋出點相同的高度，且忽略空氣阻力。</li><li>上升到最高點所需時間為 $t_{\\rm up}=v_0/g$。</li><li>在理想等加速度模型下，從最高點再下降回原高度需要相同時間 $v_0/g$。</li><li>所以總時間為 $t_{\\rm total}=2v_0/g$。若落點高度不同，不能直接套這個結果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"向量分量","formula":"A_x=A\\cos\\theta,\\qquad A_y=A\\sin\\theta","vars":"<b>$\\theta$</b>：與 $x$ 軸夾角","note":"把向量投影到垂直座標軸。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>設向量大小為 $A$，與 $x$ 軸夾角為 $\\theta$。把向量分成互相垂直的 $x$、$y$ 兩個分量後，形成直角三角形。</li><li>在三角形中，$x$ 分量是斜邊 $A$ 的鄰邊，因此由餘弦定義 $A_x/A=\\cos\\theta$。</li><li>所以 $A_x=A\\cos\\theta$。同理，$y$ 分量是對邊，由正弦定義得到 $A_y/A=\\sin\\theta$。</li><li>因此 $A_y=A\\sin\\theta$。若向量位於其他象限，則應依實際方向補上正負號。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>把向量投影到垂直座標軸。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"向量大小","formula":"A=\\sqrt{A_x^2+A_y^2}","vars":"由畢氏定理得到。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把向量 $A$ 分解成互相垂直的分量 $A_x$ 與 $A_y$ 後，三者形成直角三角形。</li><li>由畢氏定理，斜邊平方等於兩直角邊平方和：$A^2=A_x^2+A_y^2$。</li><li>兩邊取正平方根，得到 $A=\\sqrt{A_x^2+A_y^2}$。</li><li>這個式子也說明了為什麼向量分量不能直接做標量相加；垂直方向的效果必須用幾何方式合成。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"向量方向","formula":"\\tan\\theta=\\frac{A_y}{A_x}","vars":"由正切定義得到。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由分量形成的直角三角形中，若 $\\theta$ 是向量與 $x$ 軸的夾角，對邊為 $A_y$、鄰邊為 $A_x$。</li><li>依正切定義，$\\tan\\theta=\\frac{A_y}{A_x}$。</li><li>因此可利用反正切求角度：$\\theta=\\tan^{-1}(A_y/A_x)$，再依分量正負判斷正確象限。</li><li>程式卡片列的是定義關係；實際計算時若使用計算機，應特別注意 $A_x$ 的正負，避免只靠一般反正切得到錯誤象限。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"相對位置","formula":"\\vec r_{A/B}=\\vec r_A-\\vec r_B","vars":"相對位置是兩位置向量之差。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>「A 相對於 B 在哪裡」就是從 B 的位置走到 A 的位置所需的位移。</li><li>A 的位置向量為 $\\vec r_A$，B 的位置向量為 $\\vec r_B$。從 B 指向 A 的向量可用終點減起點表示。</li><li>因此 $\\vec r_{A/B}=\\vec r_A-\\vec r_B$。</li><li>交換 A、B 的順序會得到 $\\vec r_{B/A}=-\\vec r_{A/B}$，所以相對位置本身有明確方向。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"相對速度","formula":"\\vec v_{A/B}=\\vec v_A-\\vec v_B","vars":"對相對位置微分。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對相對位置 $\\vec r_{A/B}=\\vec r_A-\\vec r_B$ 對時間微分。</li><li>利用導數的線性性，得到 $\\frac{d\\vec r_{A/B}}{dt}=\\frac{d\\vec r_A}{dt}-\\frac{d\\vec r_B}{dt}$。</li><li>因為 $d\\vec r/dt=\\vec v$，所以 $\\vec v_{A/B}=\\vec v_A-\\vec v_B$。</li><li>因此若 A、B 同方向同速度前進，相對速度為零；若方向不同，就必須把速度當向量相減。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"相對加速度","formula":"\\vec a_{A/B}=\\vec a_A-\\vec a_B","vars":"對相對速度微分。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從相對速度 $\\vec v_{A/B}=\\vec v_A-\\vec v_B$ 出發。</li><li>兩邊對時間微分，得到 $\\frac{d\\vec v_{A/B}}{dt}=\\frac{d\\vec v_A}{dt}-\\frac{d\\vec v_B}{dt}$。</li><li>因為 $d\\vec v/dt=\\vec a$，所以 $\\vec a_{A/B}=\\vec a_A-\\vec a_B$。</li><li>這條關係對兩物體分別有加速度的情況仍成立，是分析追趕、相對運動與參考系問題的基本工具。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"水平拋射：水平位移","formula":"x=v_0t","vars":"水平方向無加速度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>水平拋射的初速度全部在水平方向，所以 $v_{0x}=v_0$。</li><li>理想情況下只有重力，重力垂直向下，因此水平方向沒有加速度：$a_x=0$。</li><li>由等加速度位移式 $x=v_{0x}t+\\frac12a_xt^2$，令 $a_x=0$。</li><li>得到 $x=v_0t$。也就是水平方向做等速度運動，與鉛直方向的自由落體彼此獨立。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"水平拋射：鉛直位移","formula":"y=\\frac12gt^2","vars":"鉛直方向為初速零的自由落體。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>水平拋射的初始鉛直速度為 $v_{0y}=0$。</li><li>鉛直方向只受重力，因此取向下為正時 $a_y=g$。</li><li>代入等加速度位移式 $y=v_{0y}t+\\frac12a_yt^2$。</li><li>因 $v_{0y}=0$，得到 $y=\\frac12gt^2$，也就是鉛直方向和「由靜止自由落下」完全相同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"水平拋射：落下時間","formula":"t=\\sqrt{\\frac{2y}{g}}","vars":"由鉛直位移式解時間。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從鉛直方向的自由落體關係 $y=\\frac12gt^2$ 出發。</li><li>兩邊乘以 $2$：$2y=gt^2$。</li><li>除以 $g$：$t^2=2y/g$。</li><li>取正的時間根，得到 $t=\\sqrt{2y/g}$。因此落下時間只由鉛直高度決定，不由水平初速度決定。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"水平拋射：軌跡","formula":"y=\\frac{g}{2v_0^2}x^2","vars":"消去時間可得拋物線。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>水平方向有 $x=v_0t$，因此可解出 $t=x/v_0$。</li><li>鉛直方向有 $y=\\frac12gt^2$。</li><li>把 $t=x/v_0$ 代入，得到 $y=\\frac12g(x/v_0)^2$。</li><li>整理成 $y=\\frac{g}{2v_0^2}x^2$。所以在理想模型中，水平拋射的路徑是拋物線。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射初速度分量","formula":"v_{0x}=v_0\\cos\\theta,\\qquad v_{0y}=v_0\\sin\\theta","vars":"把初速度向量分解。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把初速度向量 $\\vec v_0$ 分解成水平與鉛直兩個互相垂直的分量。</li><li>若初速度大小為 $v_0$、與水平夾角為 $\\theta$，則水平分量是直角三角形的鄰邊，所以 $v_{0x}=v_0\\cos\\theta$。</li><li>鉛直分量是對邊，所以 $v_{0y}=v_0\\sin\\theta$。</li><li>這一步本身沒有用到拋體動力學，只是向量分解；之後再分別套用水平方向等速、鉛直方向等加速度。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射位置","formula":"x=v_0\\cos\\theta\\,t,\\qquad y=v_0\\sin\\theta\\,t-\\frac12gt^2","vars":"兩方向分開處理。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>先把二維問題拆成兩個一維問題。水平方向沒有加速度，所以 $x=v_{0x}t$。</li><li>代入 $v_{0x}=v_0\\cos\\theta$，得到 $x=v_0\\cos\\theta\\,t$。</li><li>鉛直方向為等加速度運動，取向上為正時 $a_y=-g$，因此 $y=v_{0y}t-\\frac12gt^2$。</li><li>再代入 $v_{0y}=v_0\\sin\\theta$，得到 $y=v_0\\sin\\theta\\,t-\\frac12gt^2$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射速度","formula":"v_x=v_0\\cos\\theta,\\qquad v_y=v_0\\sin\\theta-gt","vars":"水平等速、鉛直等加速度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>水平分量一開始是 $v_0\\cos\\theta$，且水平方向沒有加速度，所以它始終不變：$v_x=v_0\\cos\\theta$。</li><li>鉛直分量一開始是 $v_0\\sin\\theta$，並以加速度 $-g$ 隨時間降低。</li><li>由 $v_y=v_{0y}+a_yt$，代入 $v_{0y}=v_0\\sin\\theta$、$a_y=-g$。</li><li>得到 $v_y=v_0\\sin\\theta-gt$。物體的瞬時速率則還要再用 $v=\\sqrt{v_x^2+v_y^2}$ 合成。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射飛行時間","formula":"T=\\frac{2v_0\\sin\\theta}{g}","vars":"同高度落地。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>這個結果限定「拋出點與落點同高度」。因此在落地時鉛直位移 $y=0$。</li><li>從 $y=v_0\\sin\\theta\\,t-\\frac12gt^2$ 出發，令 $y=0$。</li><li>得到 $t\\left(v_0\\sin\\theta-\\frac12gt\\right)=0$。其中 $t=0$ 是拋出的瞬間，另一個解是實際落地時間。</li><li>解得 $T=\\frac{2v_0\\sin\\theta}{g}$。若落地高度不同，必須回到位移方程重新解二次方程。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射最大高度","formula":"H=\\frac{v_0^2\\sin^2\\theta}{2g}","vars":"在最高點 $v_y=0$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>最高點的關鍵條件是鉛直速度 $v_y=0$，因為物體由上升轉為下降的瞬間，鉛直速度剛好反向。</li><li>由 $v_y=v_0\\sin\\theta-gt$ 得最高點時間 $t=v_0\\sin\\theta/g$。</li><li>代入鉛直位置 $y=v_0\\sin\\theta\\,t-\\frac12gt^2$，整理後得到 $H=\\frac{v_0^2\\sin^2\\theta}{2g}$。</li><li>也可直接使用 $v_y^2=v_{0y}^2-2gH$，令最高點 $v_y=0$，會得到相同結果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射水平射程","formula":"R=\\frac{v_0^2\\sin2\\theta}{g}","vars":"同高度落地。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>仍限定落地與拋出同高度，因此飛行時間為 $T=2v_0\\sin\\theta/g$。</li><li>水平方向等速，所以射程 $R=v_{0x}T=v_0\\cos\\theta\\,T$。</li><li>代入 $T$：$R=v_0\\cos\\theta\\cdot\\frac{2v_0\\sin\\theta}{g}$。</li><li>利用 $2\\sin\\theta\\cos\\theta=\\sin2\\theta$，得到 $R=\\frac{v_0^2\\sin2\\theta}{g}$。因此在固定初速與同高度落地條件下，$\\theta$ 與 $90^\\circ-\\theta$ 具有相同射程。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"斜向拋射軌跡","formula":"y=x\\tan\\theta-\\frac{gx^2}{2v_0^2\\cos^2\\theta}","vars":"消去時間得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從水平方程 $x=v_0\\cos\\theta\\,t$ 解出 $t=x/(v_0\\cos\\theta)$。</li><li>將這個時間代入鉛直位置 $y=v_0\\sin\\theta\\,t-\\frac12gt^2$。</li><li>第一項化成 $x\\tan\\theta$；第二項化成 $\\frac{gx^2}{2v_0^2\\cos^2\\theta}$。</li><li>因此 $y=x\\tan\\theta-\\frac{gx^2}{2v_0^2\\cos^2\\theta}$。時間被消去後，位置直接呈現為 $x,y$ 的關係，所以這就是軌跡方程。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"弧長與角位移","formula":"\\theta=\\frac{s}{r}","vars":"<b>$s$</b>：弧長 ｜ <b>$r$</b>：半徑 ｜ $\\theta$：弧度","note":"弧度由弧長除半徑定義。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>弧度制的角度不是任意規定的數字，而是用幾何比值定義：一段圓弧所對的圓心角（弧度）等於弧長除以半徑。</li><li>因此若圓弧長為 $s$、半徑為 $r$，定義 $\\theta=s/r$。</li><li>整理得到卡片上的關係 $\\theta=\\frac{s}{r}$，等價地也有 $s=r\\theta$。</li><li>一整圈弧長是 $2\\pi r$，所以一整圈的弧度為 $2\\pi r/r=2\\pi$，這也是後面 $\\omega=2\\pi/T$ 的來源。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>弧度由弧長除半徑定義。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"角速度","formula":"\\omega=\\frac{\\Delta\\theta}{\\Delta t},\\qquad\\omega=\\frac{d\\theta}{dt}","vars":"角位移對時間的變化率。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>角速度描述角位移改變得多快，和線速度描述位置改變得多快是類似的概念。</li><li>一段時間內平均角速度定義為角位移變化量除以時間：$\\omega_{\\rm avg}=\\Delta\\theta/\\Delta t$。</li><li>當時間區間縮短到無限小，得到瞬時角速度 $\\omega=d\\theta/dt$。</li><li>因此卡片同時列出的兩個形式分別對應「平均變化率」與「瞬時變化率」，不是互相矛盾的兩條公式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"切線速度與角速度","formula":"v=r\\omega","vars":"由 $s=r\theta$ 對時間微分。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>圓周上物體走過的弧長滿足 $s=r\\theta$。這裡的 $\\theta$ 必須使用弧度。</li><li>對時間微分：$ds/dt=r\\,d\\theta/dt$；當半徑固定時，$r$ 是常數。</li><li>由定義 $ds/dt=v$、$d\\theta/dt=\\omega$，因此 $v=r\\omega$。</li><li>這條式子把「轉得多快」和「圓周上實際前進多快」連接起來；同樣角速度下，半徑越大，切線速率越大。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"頻率與週期","formula":"f=\\frac1T","vars":"頻率與週期互為倒數。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>週期 $T$ 定義為完成一次完整週期所需的時間。</li><li>頻率 $f$ 定義為單位時間內完成的週期數。</li><li>因此一個週期花 $T$ 秒，就表示每秒完成 $1/T$ 個週期。</li><li>所以得到 $f=1/T$，兩者互為倒數；一個週期越久，頻率就越低。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"角速度、頻率、週期","formula":"\\omega=2\\pi f=\\frac{2\\pi}{T}","vars":"一週是 $2\\pi$ 弧度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>完成一整圈，角位移是 $2\\pi$ 弧度；完成一圈所需時間是週期 $T$。</li><li>因此平均角速度為 $\\omega=2\\pi/T$。對均勻圓周運動而言角速度恆定，所以這就是瞬時角速度。</li><li>又因 $f=1/T$，代入得到 $\\omega=2\\pi f$。</li><li>因此 $\\omega=2\\pi f=2\\pi/T$，本質上只是把「每秒幾圈」轉成「每秒幾弧度」。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"圓周切線速度","formula":"v=\\frac{2\\pi r}{T}=2\\pi rf","vars":"一週走過圓周長 $2\\pi r$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>一圈的圓周長為 $2\\pi r$，完成一圈需要時間 $T$。</li><li>平均每秒走過的距離就是一圈長度除以週期，因此 $v=2\\pi r/T$。</li><li>再使用 $f=1/T$，得到 $v=2\\pi rf$。</li><li>這也與 $v=r\\omega$ 完全一致，因為 $\\omega=2\\pi/T$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先選定正方向並一致處理速度、加速度與位移的正負號；若加速度不是常數，等加速度專用式不能直接套用。</div></div></div>"},{"cat":"motion","label":"直線與圓周運動","title":"向心加速度","formula":"a_c=\\frac{v^2}{r}=r\\omega^2","vars":"<b>$a_c$</b>：向心加速度","note":"由圓周速度方向改變，並代入 $v=r\\omega$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心鏈條是「位置 → 速度 → 加速度」，以及在等加速度條件下把這三者互相消去。很多看似不同的公式，其實只是同一組基本關係換了一種寫法。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>圓周運動即使速率固定，速度向量仍因方向改變而一直變化，因此存在指向圓心的加速度。</li><li>取很短的時間 $\\Delta t$，速度向量的方向旋轉一個小角度 $\\Delta\\theta$。對小角度，由相似三角形可得 $|\\Delta\\vec v|/v\\approx\\Delta\\theta$。</li><li>因為弧長 $\\Delta s=r\\Delta\\theta$，而在很短時間內 $\\Delta s\\approx v\\Delta t$，故 $\\Delta\\theta\\approx v\\Delta t/r$。</li><li>因此 $a_c=\\lim |\\Delta\\vec v|/\\Delta t=v^2/r$。再使用 $v=r\\omega$，得到 $a_c=r\\omega^2$。方向始終指向圓心。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>向心加速度不是另一種額外力，而是速度方向持續改變所對應的加速度。真正提供向心效果的力可能是張力、摩擦力、萬有引力或其合力。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由圓周速度方向改變，並代入 $v=r\\omega$。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"牛頓第二運動定律","formula":"\\sum\\vec F=m\\vec a","vars":"合外力、質量、加速度","note":"適用於經典力學範圍。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>牛頓第二定律的一般形式是「合外力等於動量的時間變化率」；對質量固定的物體，動量 $\\vec p=m\\vec v$。</li><li>因此 $\\sum\\vec F=d\\vec p/dt=d(m\\vec v)/dt$。若 $m$ 為常數，可移到微分外：$\\sum\\vec F=m\\,d\\vec v/dt$。</li><li>因 $d\\vec v/dt=\\vec a$，得到 $\\sum\\vec F=m\\vec a$。</li><li>實際解題時的重點是「合外力」，不是把任意一個單獨的力直接設成 $ma$；先畫受力圖、選座標，再把各力分量相加。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>適用於經典力學範圍。</div></div></div>","demo":"newton"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"重力","formula":"\\vec W=m\\vec g","vars":"<b>$W$</b>：重力大小 ｜ <b>$g$</b>：重力加速度","note":"地表附近常取 $g\u0007pprox9.8\\,\\mathrm{m/s^2}$。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>靠近地球表面時，物體受到地球的萬有引力。牛頓力學中可把這個力寫成質量乘以當地重力加速度。</li><li>由牛頓第二定律，若物體只受重力而自由落下，合力就是 $\\vec W$，加速度就是 $\\vec g$。</li><li>所以 $\\vec W=m\\vec g$。</li><li>大小為 $W=mg$；方向則與 $\\vec g$ 相同，通常在地表附近近似指向地球中心。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>地表附近常取 $g\u0007pprox9.8\\,\\mathrm{m/s^2}$。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"胡克定律","formula":"F_s=-kx","vars":"<b>$k$</b>：彈簧常數 ｜ <b>$x$</b>：相對平衡位置位移","note":"負號表示彈力指向平衡位置。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>考慮理想彈簧在未超過彈性限度的情況。若彈簧偏離自然長度 $x$，實驗顯示回復力的大小與形變量成正比。</li><li>因此可寫成大小關係 $F_s=kx$，其中 $k$ 是彈簧勁度係數。</li><li>但彈力方向總是傾向把彈簧拉回平衡位置，所以若把位移 $x$ 定義成帶符號的座標，力與位移方向相反。</li><li>於是向量形式為 $F_s=-kx$。負號不是代表「力為負的大小」，而是表示回復方向與位移方向相反；公式只在適用的彈性範圍內成立。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>負號表示彈力指向平衡位置。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"靜摩擦力條件","formula":"f_s\\le\\mu_sN","vars":"<b>$\\mu_s$</b>：靜摩擦係數","note":"靜摩擦力會隨需要調整，但有最大值。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>靜摩擦力出現在接觸面之間沒有相對滑動時，它的任務不是固定等於某個數，而是抵抗「即將發生的相對滑動」。</li><li>因此當外力較小時，靜摩擦力會自動調整大小，以滿足物體的運動條件；例如水平面上若外力為 $5\\,N$，靜摩擦力可以剛好是 $5\\,N$。</li><li>最大靜摩擦力與正向力成正比，大小上限為 $\\mu_sN$。</li><li>所以一般條件寫成 $f_s\\le\\mu_sN$；只有在「恰好要滑動」的臨界狀態，才可取 $f_s=\\mu_sN$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>靜摩擦力不是永遠等於 $\\mu_sN$。它是「自我調整到剛好阻止相對滑動的值」，直到達到上限 $\\mu_sN$。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>靜摩擦力會隨需要調整，但有最大值。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"最大靜摩擦力","formula":"f_{s,\\max}=\\mu_sN","vars":"即將開始滑動時使用。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在接觸面即將開始相對滑動的臨界狀態，靜摩擦力達到可提供的最大值。</li><li>實驗上最大靜摩擦力與正向力 $N$ 成正比，把比例常數定義為靜摩擦係數 $\\mu_s$。</li><li>因此 $f_{s,\\max}=\\mu_sN$。</li><li>注意這是「上限」，不是任何靜止情況下的靜摩擦力；若外力不足以讓物體趨於滑動，實際 $f_s$ 可能遠小於此值。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"動摩擦力","formula":"f_k=\\mu_kN","vars":"<b>$\\mu_k$</b>：動摩擦係數","note":"已發生相對滑動時使用。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>當兩接觸面已經發生相對滑動時，改用動摩擦力描述滑動造成的阻力。</li><li>在理想的高中模型中，動摩擦力大小近似與正向力成正比，比例常數定義為動摩擦係數 $\\mu_k$。</li><li>因此 $f_k=\\mu_kN$。</li><li>動摩擦力方向一定與接觸面的相對運動方向相反；在一般乾摩擦模型中，$\\mu_k$ 通常小於 $\\mu_s$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／
