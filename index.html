注意</div><div>已發生相對滑動時使用。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"斜面正向力","formula":"N=mg\\cos\\theta","vars":"只有重力等典型情況下成立。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>物體放在傾角 $\\theta$ 的斜面上，先把重力 $mg$ 分解成垂直斜面與平行斜面兩個分量。</li><li>若垂直斜面方向沒有加速度，則該方向的合力必須為零。</li><li>重力垂直斜面的分量大小為 $mg\\cos\\theta$，斜面正向力 $N$ 則向外抵住它。</li><li>所以 $N-mg\\cos\\theta=0$，得到 $N=mg\\cos\\theta$。若還有其他垂直斜面的力，這個簡式就不能直接套用。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"重力沿斜面分量","formula":"F_{\\parallel}=mg\\sin\\theta","vars":"由力的向量分解得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>將重力向量 $mg$ 分解成沿斜面與垂直斜面的分量。</li><li>若斜面與水平夾角為 $\\theta$，垂直斜面的分量為 $mg\\cos\\theta$，剩下沿斜面向下的分量由直角三角形得到。</li><li>利用正弦關係可得沿斜面分量為 $F_{\\parallel}=mg\\sin\\theta$。</li><li>這個分量並不是額外多出的一個力，而是原本重力在特定座標方向上的投影。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"無摩擦斜面加速度","formula":"a=g\\sin\\theta","vars":"沿斜面套用 $\\sum F=ma$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>無摩擦表示沿斜面方向除了重力分量外沒有阻力。</li><li>沿斜面方向的合力為 $F_{\\parallel}=mg\\sin\\theta$。</li><li>套用牛頓第二定律：$mg\\sin\\theta=ma$。</li><li>兩邊除以 $m$，得到 $a=g\\sin\\theta$。可以看出物體質量在這個理想結果中消掉了。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"有動摩擦斜面下滑加速度","formula":"a=g(\\sin\\theta-\\mu_k\\cos\\theta)","vars":"假設物體沿斜面向下滑。","note":"由 $mg\\sin\theta-f_k=ma$ 並代入 $f_k=\\mu_kmg\\cos\theta$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>假設物體沿斜面向下滑動。重力沿斜面分量向下為 $mg\\sin\\theta$。</li><li>動摩擦力反向，因此向上，大小為 $f_k=\\mu_kN$。若只有重力造成的正向力，$N=mg\\cos\\theta$。</li><li>所以沿斜面合力為 $mg\\sin\\theta-\\mu_kmg\\cos\\theta$。</li><li>套用 $F=ma$ 並除以 $m$，得到 $a=g(\\sin\\theta-\\mu_k\\cos\\theta)$。若結果為負，表示「假設向下加速」與實際運動方向不一致。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由 $mg\\sin\theta-f_k=ma$ 並代入 $f_k=\\mu_kmg\\cos\theta$。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"水平粗糙路面最大轉彎速度","formula":"v_{\\max}=\\sqrt{\\mu_sgr}","vars":"由最大靜摩擦力提供向心力。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>車子在水平圓周上轉彎時，需要指向圓心的向心力 $mv^2/r$。</li><li>水平路面上，重力與正向力在鉛直方向平衡，因此 $N=mg$。輪胎與路面之間最大的靜摩擦力為 $f_{s,\\max}=\\mu_sN=\\mu_smg$。</li><li>若沒有其他水平力，靜摩擦力必須提供向心力，因此在「剛好不打滑」的極限有 $mv^2/r=\\mu_smg$。</li><li>消去 $m$ 並解 $v$，得到 $v_{\\max}=\\sqrt{\\mu_sgr}$。真正轉彎時若速度低於此值，靜摩擦力可以只取所需的較小值。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"萬有引力定律","formula":"F=G\\frac{m_1m_2}{r^2}","vars":"<b>$G$</b>：萬有引力常數 ｜ <b>$r$</b>：兩質心距離","note":"質量乘積正比、距離平方反比。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>實驗與天文觀測指出，兩質點間的引力與兩物體質量的乘積成正比：$F\\propto m_1m_2$。</li><li>同時，引力隨距離增加而減弱，並符合反平方關係：$F\\propto1/r^2$。</li><li>合併比例關係得到 $F\\propto m_1m_2/r^2$，把比例常數定義為萬有引力常數 $G$。</li><li>因此 $F=Gm_1m_2/r^2$。對球對稱物體，在外部可把質量近似集中於球心，$r$ 是兩物體中心間距離。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>質量乘積正比、距離平方反比。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"重力場強度","formula":"g=\\frac{GM}{r^2}","vars":"<b>$M$</b>：產生重力場的天體質量","note":"由萬有引力除以受力物體質量得到。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在質量為 $M$ 的天體周圍放一個很小的測試質量 $m$。依萬有引力定律，它受到的力大小為 $F=GMm/r^2$。</li><li>重力場強度定義為「單位質量所受的重力」，因此 $g=F/m$。</li><li>把 $F$ 代入：$g=(GMm/r^2)/m$。測試質量 $m$ 消掉，得到 $g=GM/r^2$。</li><li>因此同一位置的重力場強度與測試物體自身質量無關；這正是自由落體加速度與物體質量無關的原因。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由萬有引力除以受力物體質量得到。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"圓軌道速度","formula":"v=\\sqrt{\\frac{GM}{r}}","vars":"令萬有引力提供向心力。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>考慮質量 $m$ 的衛星以半徑 $r$ 繞質量 $M$ 的天體做理想圓周運動。</li><li>衛星需要向心力 $mv^2/r$，而提供向心力的就是萬有引力 $GMm/r^2$。</li><li>令兩者相等：$GMm/r^2=mv^2/r$。</li><li>消去 $m$、整理 $v^2=GM/r$，因此 $v=\\sqrt{GM/r}$。半徑越大，圓軌道速度反而越小。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"圓軌道週期","formula":"T=2\\pi\\sqrt{\\frac{r^3}{GM}}","vars":"由 $v=2\\pi r/T$ 聯立得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>週期定義為走完整個圓周所需的時間，而圓周長為 $2\\pi r$。因此 $T=2\\pi r/v$。</li><li>把圓軌道速度 $v=\\sqrt{GM/r}$ 代入：$T=2\\pi r/\\sqrt{GM/r}$。</li><li>把分母的 $\\sqrt{GM/r}$ 化簡，得到 $T=2\\pi\\sqrt{r^3/(GM)}$。</li><li>平方後得到 $T^2=4\\pi^2r^3/(GM)$，這直接連到克卜勒第三定律。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"克卜勒第三定律","formula":"T^2\\propto a^3","vars":"<b>$a$</b>：橢圓半長軸","note":"同一中心天體下的軌道關係。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由圓軌道推導可得 $T^2=\\frac{4\\pi^2}{GM}r^3$。若不是只討論圓，而以橢圓軌道描述，$r$ 的位置要改用橢圓半長軸 $a$。</li><li>對同一個中心天體而言 $G$ 與 $M$ 都固定，因此前面的係數 $4\\pi^2/(GM)$ 是常數。</li><li>所以 $T^2$ 與 $a^3$ 成正比：$T^2\\propto a^3$。</li><li>這不是說所有天體的週期都一樣，而是說繞同一中心天體的不同軌道有固定的比例關係。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>同一中心天體下的軌道關係。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"克卜勒第三定律比較式","formula":"\\frac{T_1^2}{T_2^2}=\\frac{a_1^3}{a_2^3}","vars":"兩軌道繞同一中心天體時。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對繞同一中心天體的兩個軌道，克卜勒第三定律分別給出 $T_1^2=Ka_1^3$、$T_2^2=Ka_2^3$。</li><li>兩式相除後，比例常數 $K$ 消掉：$T_1^2/T_2^2=a_1^3/a_2^3$。</li><li>因此可利用已知一個軌道的週期與半長軸，求另一個軌道的量。</li><li>前提是比較的物體繞的是同一個中心天體，且可忽略衛星本身質量對中心的影響。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"萬有引力位能","formula":"U=-\\frac{GMm}{r}","vars":"以無限遠位能為零。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>重力是保守力，因此可以定義位能，使得保守力作功等於位能的減少。</li><li>取無限遠為位能零點，從無限遠把質量 $m$ 移到距離 $r$ 的位置，重力位能會降低。</li><li>因萬有引力 $F=GMm/r^2$，把力沿徑向積分可得 $U(r)-U(\\infty)=-\\int_r^{\\infty}GMm/r\\\\'^2\\,dr\\'$。</li><li>由積分結果得到 $U=-GMm/r$。負號表示以無限遠為零時，有限距離的引力束縛狀態具有負的位能；這與近地表的 $mgh$ 是同一物理量在不同近似與零點選擇下的表示。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"近地表重力位能","formula":"U=mgh","vars":"高度範圍不大、$g$ 近似常數。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>地表附近若高度變化 $h$ 遠小於地球半徑，可把 $g$ 視為常數。</li><li>物體向上移動高度 $h$ 時，重力方向向下，而外力若以等速搬運物體，必須對抗重力做功 $W=mgh$。</li><li>依位能定義，外力緩慢搬運所增加的位能等於對抗保守力所作的功，因此 $\\Delta U=mgh$。</li><li>若把高度零點選在 $h=0$，就得到 $U=mgh$。位能的絕對零點可以任意選，真正具有物理意義的是位能差。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"第一宇宙速度","formula":"v_1=\\sqrt{\\frac{GM}{R}}","vars":"近地圓軌道速度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>第一宇宙速度是使物體在天體表面附近形成理想圓軌道所需的最小水平軌道速度模型。</li><li>在半徑約為天體半徑 $R$ 的圓軌道上，萬有引力提供向心力：$GMm/R^2=mv_1^2/R$。</li><li>消去 $m$ 並整理：$v_1^2=GM/R$。</li><li>因此 $v_1=\\sqrt{GM/R}$。利用 $g=GM/R^2$ 也能寫成 $v_1=\\sqrt{gR}$。這是假設無大氣、無地形、只考慮理想圓軌道的結果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"newton","label":"牛頓定律與萬有引力","title":"逃逸速度","formula":"v_e=\\sqrt{\\frac{2GM}{R}}","vars":"總機械能剛好達到無限遠零能量。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是自由體圖與牛頓定律：先找出真正作用在物體上的力，再把力投影到適合的座標軸，最後用合力與加速度的關係建立方程式。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>要讓物體從半徑 $R$ 的天體表面逃到無限遠，最小情況可令到達無限遠時速度趨近零。</li><li>取無限遠位能為零，表面初始總能量為 $K_i+U_i=\\frac12mv_e^2-GMm/R$。</li><li>臨界逃逸時無限遠的總能量為零，因此 $\\frac12mv_e^2-GMm/R=0$。</li><li>解得 $v_e=\\sqrt{2GM/R}$。與圓軌道速度比較可知 $v_e=\\sqrt2\\,v_1$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先畫受力圖並辨認合外力；公式中的 $F$ 若表示大小，必須先確認方向與坐標分量。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"定力作功","formula":"W=\\vec F\\cdot\\vec d=Fd\\cos\\theta","vars":"<b>$\\theta$</b>：力與位移夾角","note":"只有沿位移方向的力分量做功。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>功描述一個力在物體位移方向上傳遞了多少能量。</li><li>若力與位移夾角為 $\\theta$，只有沿位移方向的力分量 $F\\cos\\theta$ 對位移產生功。</li><li>因此功為平行分量乘上位移：$W=(F\\cos\\theta)d$。</li><li>用向量內積表示可寫成 $W=\\vec F\\cdot\\vec d=Fd\\cos\\theta$。若力垂直位移，$\\theta=90^\\circ$，功為零；若反向，功為負。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>只有沿位移方向的力分量做功。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"變力作功","formula":"W=\\int\\vec F\\cdot d\\vec r","vars":"將每一小段微小作功累加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>當力的大小或方向會隨位置改變時，不能直接使用單一 $Fd\\cos\\theta$。</li><li>把路徑切成非常小的位移 $d\\vec r$，在每一小段上，力可以近似看成不變。這一小段功為 $dW=\\vec F\\cdot d\\vec r$。</li><li>把整條路徑上所有微小功加起來，就是沿路徑的積分：$W=\\int\\vec F\\cdot d\\vec r$。</li><li>因此積分不是額外的物理定律，而是把「每一小段的功相加」用數學精確表示。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"動能","formula":"K=\\frac12mv^2","vars":"動能是速度大小的函數。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>動能是物體因運動狀態而具有的能量。要從牛頓力學建立它，可從功開始。</li><li>對質量固定、沿運動方向的力，$W=Fs=max$ 類型可用 $F=ma$。再利用 $a=v\\,dv/dx$，可把空間上的功改寫成 $W=\\int ma\\,dx=\\int mv\\,dv$。</li><li>積分得到 $W=\\frac12mv^2-\\frac12mv_0^2$，因此能用一個只由狀態決定的量 $K=\\frac12mv^2$ 描述。</li><li>所以動能定義為 $K=\\frac12mv^2$；它是標量，且只取決於速度大小而不直接取決於方向。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"功—動能定理","formula":"W_{\\rm net}=\\Delta K","vars":"合力作功等於動能改變。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由牛頓第二定律，沿運動方向的合力滿足 $F_{\\rm net}=ma$。</li><li>合力作功為 $W_{\\rm net}=\\int F_{\\rm net}\\,dx=\\int ma\\,dx$。利用 $a=v\\,dv/dx$，得到 $W_{\\rm net}=\\int mv\\,dv$。</li><li>積分後得到 $W_{\\rm net}=\\frac12mv_f^2-\\frac12mv_i^2=K_f-K_i$。</li><li>因此 $W_{\\rm net}=\\Delta K$。這條定理把「力造成的累積效果」直接轉成「動能改變」，常常比逐時刻求加速度更方便。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"彈簧位能","formula":"U_s=\\frac12kx^2","vars":"由胡克定律積分得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>胡克定律告訴我們理想彈簧的回復力大小為 $F=kx$，且方向與位移相反。</li><li>彈簧從自然長度拉伸或壓縮到 $x$ 時，儲存的位能等於外力克服彈力所作的功。</li><li>因彈力不是固定值，而是從 $0$ 線性增加到 $kx$，所以功等於 $F$-$x$ 圖下的三角形面積：$U_s=\\frac12\\,x\\,(kx)$。</li><li>得到 $U_s=\\frac12kx^2$。平方使伸長與壓縮都能得到正的儲能；相對的彈力則由 $F_s=-kx$ 決定方向。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"力學能","formula":"E_{\\rm mech}=K+U","vars":"動能與位能之和。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在只涉及平動的基本模型中，動能描述運動狀態，位能描述物體在保守力場中的位置狀態。</li><li>把兩種能量放在一起，就定義力學能為 $E_{\\rm mech}=K+U$。</li><li>這個定義本身不是守恆定律；是否守恆要看系統受到哪些力。</li><li>如果只有保守力作功，$K$ 與 $U$ 可以互相轉換，但總和保持不變；若有摩擦等非保守力，力學能則可能轉成熱等其他形式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"力學能守恆","formula":"K_i+U_i=K_f+U_f","vars":"只有保守力作功時。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>保守力的特色是可以用位能表示，而且保守力作功滿足 $W_c=-\\Delta U$。</li><li>另一方面，功—動能定理給出 $W_{\\rm net}=\\Delta K$。若只有保守力作功，就有 $\\Delta K=W_c=-\\Delta U$。</li><li>因此 $\\Delta K+\\Delta U=0$，也就是 $\\Delta(K+U)=0$。</li><li>所以初末狀態滿足 $K_i+U_i=K_f+U_f$。若存在摩擦、外界輸入或其他非保守作用，就要把相應能量交換另外列出。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>守恆條件比公式本身更重要：只有當系統中的非保守力不造成力學能損失或輸出時，才可直接寫 $K_i+U_i=K_f+U_f$。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"非保守力與力學能","formula":"W_{\\rm nc}=\\Delta E_{\\rm mech}","vars":"摩擦等非保守力可改變力學能。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>一般情況下，總功可以分成保守力作功與非保守力作功：$W_{\\rm total}=W_c+W_{\\rm nc}$。</li><li>由功—動能定理，$W_{\\rm total}=\\Delta K$；由保守力定義，$W_c=-\\Delta U$。</li><li>代入得到 $\\Delta K=-\\Delta U+W_{\\rm nc}$。移項後 $\\Delta(K+U)=W_{\\rm nc}$。</li><li>因此 $W_{\\rm nc}=\\Delta E_{\\rm mech}$。正負號取決於你對「非保守力作功」的定義；這裡沿用卡片所採用的「非保守力對系統作功」為正。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>摩擦力並沒有讓能量消失；它是把原本可用的機械能轉移到熱能、內能等其他形式。因此「機械能不守恆」並不等於「總能量不守恆」。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"平均功率","formula":"P_{\\rm avg}=\\frac{W}{\\Delta t}","vars":"單位時間完成的功。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>功率描述能量傳遞或作功的快慢。</li><li>在時間區間 $\\Delta t$ 內完成功 $W$，則單位時間平均完成的功就是 $W/\\Delta t$。</li><li>因此 $P_{\\rm avg}=W/\\Delta t$。</li><li>注意功率不是功本身；相同的功若在更短時間完成，功率更大。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"瞬時功率","formula":"P=\\frac{dW}{dt}","vars":"平均功率取極限。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>平均功率為 $W/\\Delta t$，若希望知道某一時刻的作功快慢，就讓時間區間縮到零。</li><li>令 $\\Delta t\\to0$，得到 $P=\\lim_{\\Delta t\\to0}\\Delta W/\\Delta t=dW/dt$。</li><li>因此瞬時功率是功對時間的導數，也可以理解成能量流率。</li><li>若力與速度隨時間改變，這個形式仍然適用，不需要先假設力是常數。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"力與速度的功率關係","formula":"P=\\vec F\\cdot\\vec v","vars":"由 $dW=\u000bec F\\cdot d\u000bec r$ 推得。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從瞬時功率 $P=dW/dt$ 出發。</li><li>微小功為 $dW=\\vec F\\cdot d\\vec r$，因此 $P=\\frac{dW}{dt}=\\vec F\\cdot\\frac{d\\vec r}{dt}$。</li><li>因 $d\\vec r/dt=\\vec v$，得到 $P=\\vec F\\cdot\\vec v$。</li><li>若力與速度同向，$P=Fv$；若反向，功率為負；若垂直，瞬時功率為零。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"動量","formula":"\\vec p=m\\vec v","vars":"質量與速度向量的乘積。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>動量是描述物體平移運動「運動量」的向量量。牛頓力學中把質量與速度結合，定義為 $\\vec p=m\\vec v$。</li><li>質量越大、速度越大，動量大小越大；因速度是向量，所以動量也有方向。</li><li>這個定義之所以重要，是因為牛頓第二定律可寫成 $\\vec F=d\\vec p/dt$，而碰撞問題可以直接利用總動量守恆分析。</li><li>因此動量不是「力乘時間」本身；力乘時間是衝量，衝量等於動量的改變量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"動量形式的牛頓第二定律","formula":"\\vec F=\\frac{d\\vec p}{dt}","vars":"質量固定時回到 $\u000bec F=m\u000bec a$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>牛頓第二定律的一般形式定義為合外力等於動量的變化率：$\\vec F=d\\vec p/dt$。</li><li>若 $\\vec p=m\\vec v$，則 $\\vec F=d(m\\vec v)/dt$。</li><li>當質量固定時可寫成 $\\vec F=m\\,d\\vec v/dt=m\\vec a$，因此退化為熟悉的 $F=ma$。</li><li>這個形式比 $F=ma$ 更一般，特別適合處理質量改變的系統或從衝量、動量守恆出發的問題。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"衝量","formula":"\\vec J=\\Delta\\vec p","vars":"<b>$\\vec J$</b>：衝量","note":"由力對時間積分得到。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若物體受到力一段時間，最直接的效果不是只看某一瞬間的力，而是看力在整段時間內累積了多少。</li><li>由 $\\vec F=d\\vec p/dt$，兩邊乘上 $dt$：$\\vec F\\,dt=d\\vec p$。</li><li>對整個作用時間積分，得到 $\\int\\vec F\\,dt=\\Delta\\vec p$。左邊就定義為衝量 $\\vec J$。</li><li>因此 $\\vec J=\\Delta\\vec p$。衝量的方向等於動量改變的方向，與平均力方向一致。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由力對時間積分得到。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"平均力與衝量","formula":"\\vec J=\\vec F_{\\rm avg}\\Delta t","vars":"變力用平均力等效表示。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若一段時間內的力大小與方向可能改變，可以先用平均力來表示「相同總衝量」的等效恒定力。</li><li>衝量定義為作用時間內力的積分：$\\vec J=\\int\\vec F\\,dt$。</li><li>定義平均力使得 $\\vec J=\\vec F_{\\rm avg}\\Delta t$。</li><li>若力真的恒定，平均力就等於實際力；若力隨時間變化，平均力則是將整段力—時間圖面積用一個矩形等效表示。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"平均力","formula":"\\vec F_{\\rm avg}=\\frac{\\Delta\\vec p}{\\Delta t}","vars":"由衝量定義整理。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由衝量關係 $\\vec J=\\Delta\\vec p$ 與 $\\vec J=\\vec F_{\\rm avg}\\Delta t$ 出發。</li><li>令兩者相等：$\\vec F_{\\rm avg}\\Delta t=\\Delta\\vec p$。</li><li>兩邊除以作用時間，得到 $\\vec F_{\\rm avg}=\\Delta\\vec p/\\Delta t$。</li><li>這說明在短碰撞時間內，力可能非常大，但只要作用時間足夠短，仍可以用同一衝量描述其造成的動量改變。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"動量守恆","formula":"\\sum\\vec p_i=\\sum\\vec p_f","vars":"系統外力合衝量為零。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對多物體系統，總動量是所有物體動量的向量總和。</li><li>若只考慮系統內部相互作用，內力依牛頓第三定律成對抵消，因此系統總動量的變化只由外力決定。</li><li>若系統所受合外力為零，則 $d\\vec P/dt=0$，表示總動量不隨時間改變。</li><li>因此 $\\sum\\vec p_i=\\sum\\vec p_f$。碰撞、爆炸、後座等題型都以「挑對系統，使外力衝量可忽略」為核心。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>真正的條件是系統所受的外力合力在所考慮的時間尺度下為零（或外力衝量可忽略）。內力可以很大，但內力彼此成對抵消，所以不改變系統總動量。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"一維碰撞動量守恆","formula":"m_1v_1+m_2v_2=m_1v_1'+m_2v_2'","vars":"總動量守恆在一維的形式。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>先選定一維正方向，因此每個物體的速度都可以用帶正負號的純量表示。</li><li>碰撞前總動量為 $m_1v_1+m_2v_2$，碰撞後為 $m_1v_1\\\\'+m_2v_2\\\\'$。</li><li>若碰撞過程的外力衝量可忽略，套用動量守恆，令前後總動量相等。</li><li>因此得到 $m_1v_1+m_2v_2=m_1v_1\\'+m_2v_2\\'$。速度的正負號很重要，不能只代入速率。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"完全非彈性碰撞","formula":"m_1v_1+m_2v_2=(m_1+m_2)v'","vars":"碰撞後兩物體黏在一起。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>完全非彈性碰撞的特徵是碰撞後兩物體黏在一起，因此兩者具有相同的末速度 $v\\'$。</li><li>若外力衝量可忽略，仍然可以使用動量守恆。</li><li>碰撞前總動量為 $m_1v_1+m_2v_2$，碰撞後兩物體合在一起，質量為 $m_1+m_2$，動量為 $(m_1+m_2)v\\'$。</li><li>所以 $m_1v_1+m_2v_2=(m_1+m_2)v'$。注意：動量仍守恆，但機械動能通常不守恆，部分能量轉成熱、聲音與形變能。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg \frac12m_2v_2'^2","vars":"理想彈性碰撞的第二個守恆條件。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>彈性碰撞的定義是碰撞前後總動能相同，因此直接寫出前後的動能總和。</li><li>碰撞前：$K_i=\\frac12m_1v_1^2+\\frac12m_2v_2^2$；碰撞後：$K_f=\\frac12m_1v_1\\\\'^2+\\frac12m_2v_2\\\\'^2$。</li><li>彈性碰撞要求 $K_i=K_f$，於是得到卡片中的等式。</li><li>將此式與動量守恆聯立，就能解出許多一維彈性碰撞問題；單獨使用動能守恆通常不足以決定所有末速度。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"恢復係數","formula":"e=\\frac{v_2'-v_1'}{v_1-v_2}","vars":"<b>$e$</b>：恢復係數","note":"完全彈性 $e=1$；完全非彈性 $e=0$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>碰撞前兩物體的相對接近速度是一個速度差，碰撞後則有相對分離速度。</li><li>恢復係數 $e$ 定義為「碰撞後相對分離速率」除以「碰撞前相對接近速率」。在一維且選定正方向後，常寫成 $e=(v_2\\\\'-v_1\\\\')/(v_1-v_2)$。</li><li>完全彈性碰撞有最大恢復程度，所以 $e=1$；完全非彈性碰撞後兩者一起運動，相對速度變成零，所以 $e=0$。</li><li>對一般碰撞，$0<e<1$ 是常見情況。恢復係數描述的是速度差恢復程度，不等同於「能量保存比例」。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>完全彈性 $e=1$；完全非彈性 $e=0$。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"質心位置","formula":"\\vec r_{\\rm cm}=\\frac{\\sum_i m_i\\vec r_i}{\\sum_i m_i}","vars":"質量加權平均的位置。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>質心可以視為把整個系統的質量分布用一個「質量加權平均位置」表示。</li><li>質量越大的物體，應對質心位置具有越大的權重，因此不能使用單純的幾何平均。</li><li>對各質點位置向量 $\\vec r_i$，以質量 $m_i$ 加權並求和，再除以總質量 $M=\\sum m_i$。</li><li>因此 $\\vec r_{\\rm cm}=\\frac{\\sum m_i\\vec r_i}{\\sum m_i}$。兩物體時，質心會更靠近質量較大的物體。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"一維質心位置","formula":"x_{\\rm cm}=\\frac{\\sum_i m_ix_i}{\\sum_i m_i}","vars":"質心的一維形式。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把質心的向量公式限制在單一直線方向，只需保留一個座標 $x$。</li><li>每個物體的位置以其質量加權，分子為 $\\sum m_ix_i$。</li><li>再除以系統總質量 $\\sum m_i$，得到 $x_{\\rm cm}=\\frac{\\sum m_ix_i}{\\sum m_i}$。</li><li>這是一個加權平均，因此當某物體質量很大時，質心會更靠近它的位置。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"質心速度","formula":"\\vec v_{\\rm cm}=\\frac{\\sum_i m_i\\vec v_i}{M}","vars":"<b>$M$</b>：總質量","note":"對質心位置微分。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從質心位置 $\\vec r_{\\rm cm}=\\frac{\\sum m_i\\vec r_i}{M}$ 出發。若各物體質量固定，總質量 $M$ 也是常數。</li><li>對時間微分：$\\vec v_{\\rm cm}=\\frac{1}{M}\\sum m_i\\frac{d\\vec r_i}{dt}$。</li><li>因 $d\\vec r_i/dt=\\vec v_i$，得到 $\\vec v_{\\rm cm}=\\frac{\\sum m_i\\vec v_i}{M}$。</li><li>乘上總質量後得到下一張卡的關係 $M\\vec v_{\\rm cm}=\\sum m_i\\vec v_i$，也就是系統總動量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>對質心位置微分。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"質心加速度","formula":"\\vec a_{\\rm cm}=\\frac{\\sum_i m_i\\vec a_i}{M}","vars":"對質心速度微分。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由質心速度 $\\vec v_{\\rm cm}=\\frac{\\sum m_i\\vec v_i}{M}$ 出發。</li><li>在總質量固定時對時間微分：$\\vec a_{\\rm cm}=\\frac{1}{M}\\sum m_i\\vec a_i$。</li><li>因此 $\\vec a_{\\rm cm}$ 是各物體加速度的質量加權平均。</li><li>若再使用系統總外力關係，可得到 $M\\vec a_{\\rm cm}=\\sum\\vec F_{\\rm ext}$，這是用質心分析多體系統的重要結果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"系統總動量與質心","formula":"\\vec P=M\\vec v_{\\rm cm}","vars":"總動量等於總質量乘質心速度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由質心速度定義，$\\vec v_{\\rm cm}=\\frac{\\sum m_i\\vec v_i}{M}$。</li><li>兩邊乘以總質量 $M$：$M\\vec v_{\\rm cm}=\\sum m_i\\vec v_i$。</li><li>右邊正是所有粒子動量的向量總和，也就是系統總動量 $\\vec P$。</li><li>因此 $\\vec P=M\\vec v_{\\rm cm}$：研究系統整體的平移運動時，可以把全部複雜的內部運動濃縮成質心的運動。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"力矩","formula":"\\vec\\tau=\\vec r\\times\\vec F","vars":"描述力造成的轉動效果。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>力不只會造成平移，也可能讓物體繞某個參考點旋轉。旋轉效果取決於施力點到參考點的位置向量 $\\vec r$ 與力 $\\vec F$。</li><li>只有垂直於 $\\vec r$ 的力分量會產生轉動效果，因此用叉積定義力矩：$\\vec\\tau=\\vec r\\times\\vec F$。</li><li>叉積方向依右手定則決定，代表旋轉軸方向。大小則與 $r$、$F$ 及兩者夾角有關。</li><li>因此力矩是向量；改變力的作用線位置，即使力大小不變，也可能大幅改變旋轉效果。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"力矩大小","formula":"\\tau=rF\\sin\\theta=F\\ell","vars":"<b>$\\ell$</b>：力臂","note":"力乘以到轉軸的垂直距離。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由叉積大小公式，$|\\vec r\\times\\vec F|=rF\\sin\\theta$。</li><li>其中 $F\\sin\\theta$ 就是力在垂直於位置向量方向上的分量。</li><li>也可以改用力臂 $\\ell$ 表示：$\\ell=r\\sin\\theta$ 是參考點到力作用線的最短垂距。</li><li>因此 $\\tau=rF\\sin\\theta=F\\ell$。當力的作用線通過支點時，力臂為零，力矩也為零。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>力乘以到轉軸的垂直距離。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"角動量","formula":"\\vec L=\\vec r\\times\\vec p","vars":"位置與動量的叉積。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>角動量是平移動量 $\\vec p$ 對旋轉運動的對應量。相對某一參考點，位置向量為 $\\vec r$。</li><li>定義角動量為位置向量與動量的叉積：$\\vec L=\\vec r\\times\\vec p$。</li><li>大小為 $L=rp\\sin\\theta$，其中只有垂直於半徑的動量分量會貢獻角動量。</li><li>若粒子做半徑 $r$ 的圓周運動，速度與半徑垂直，因此 $L=rmv=mvr$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"圓周運動角動量","formula":"L=mvr","vars":"以圓心為轉軸且 $\u000bec r\\perp\u000bec p$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>角動量一般為 $L=rp\\sin\\theta$。</li><li>圓周運動時，速度方向是切線方向，與半徑方向垂直，所以 $\\theta=90^\\circ$，$\\sin\\theta=1$。</li><li>又有動量大小 $p=mv$，代入即可得到 $L=rmv=mvr$。</li><li>若再使用 $v=r\\omega$，可寫成 $L=mr^2\\omega$；這是質點圓周運動中很重要的形式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"力矩與角動量","formula":"\\vec\\tau=\\frac{d\\vec L}{dt}","vars":"轉動版牛頓第二定律。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從角動量定義 $\\vec L=\\vec r\\times\\vec p$ 出發，對時間微分。</li><li>利用乘積微分法則：$d\\vec L/dt=(d\\vec r/dt)\\times\\vec p+\\vec r\\times(d\\vec p/dt)$。</li><li>因 $d\\vec r/dt=\\vec v$，第一項為 $\\vec v\\times m\\vec v=0$；第二項利用 $d\\vec p/dt=\\vec F$，得到 $\\vec r\\times\\vec F$。</li><li>因此 $d\\vec L/dt=\\vec\\tau$，即 $\\vec\\tau=\\frac{d\\vec L}{dt}$。這是旋轉版的 $\\vec F=d\\vec p/dt$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"角動量守恆","formula":"\\vec L_i=\\vec L_f","vars":"外力矩合力為零時。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由 $\\vec\\tau=d\\vec L/dt$，若系統所受合外力矩為零，則 $d\\vec L/dt=0$。</li><li>導數為零代表角動量不隨時間改變。</li><li>因此 $\\vec L_i=\\vec L_f$。</li><li>它可以出現在行星運動、旋轉體、陀螺與碰撞問題中；實際應用時關鍵是判斷選定的參考點或系統是否真的沒有外力矩。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>要判斷角動量是否守恆，必須先指定參考原點／軸，並確認關於該點的外力矩總和為零。不同參考點的角動量守恆判斷可能不同。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"平移平衡","formula":"\\sum\\vec F=0","vars":"無平移加速度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>平移平衡表示物體的質心沒有加速度，$\\vec a=0$。</li><li>由牛頓第二定律 $\\sum\\vec F=m\\vec a$，代入 $\\vec a=0$。</li><li>得到 $\\sum\\vec F=0$。</li><li>在二維問題中通常拆成兩個互相垂直方向：$\\sum F_x=0$、$\\sum F_y=0$；這只保證平移不加速，並不自動保證不旋轉。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"轉動平衡","formula":"\\sum\\tau=0","vars":"無角加速度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>轉動平衡表示物體的角加速度為零。</li><li>在轉動力學中，外力矩與角動量變化率有關；對剛體繞固定軸且轉動慣量固定時可理解為 $\\sum\\tau=I\\alpha$。</li><li>當角加速度 $\\alpha=0$ 時，合力矩必須為零。</li><li>因此得到 $\\sum\\tau=0$。選擇合適支點計算力矩，可以大幅簡化剛體平衡題。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"剛體二維平衡條件","formula":"\\sum F_x=0,\\qquad\\sum F_y=0,\\qquad\\sum\\tau=0","vars":"二維剛體靜力平衡的三個條件。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>二維剛體若完全靜止，就不能有平移加速度，也不能有角加速度。</li><li>平移平衡要求水平方向與鉛直方向的合力都為零：$\\sum F_x=0$、$\\sum F_y=0$。</li><li>旋轉平衡另外要求相對任意方便參考點的合力矩為零：$\\sum\\tau=0$。</li><li>三個條件合在一起，才足以描述平面剛體的靜力平衡。它們彼此獨立，不能只使用其中一、兩個條件。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"energy","label":"功、能量與動量","title":"效率","formula":"\\eta=\\frac{E_{\\rm useful}}{E_{\\rm input}}\\times100\\%","vars":"也可以用功率比表示。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類的核心是「狀態改變由能量／動量來描述」。許多結果不是獨立背誦的定律，而是由功、動能、動量、力矩等基本定義，再配合守恆條件推導而來。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>能量轉換設備通常不是把輸入能量全部轉成目標形式，部分會以熱、聲音、摩擦等形式散失。</li><li>因此先定義「有用輸出」與「輸入總量」的比例：$\\eta=E_{\\rm useful}/E_{\\rm input}$。</li><li>為了用百分比表示，再乘上 $100\\%$，得到卡片上的公式。</li><li>同樣概念可對功率使用 $\\eta=P_{\\rm useful}/P_{\\rm input}$；因為相同時間內能量與功率成正比，所以形式相同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先界定系統與能量型態，再判斷是否有非保守力或外界能量輸入；守恆式的成立條件比形式本身重要。</div></div></div>"},{"cat":"fluid","label":"流體","title":"密度","formula":"\\rho=\\frac{m}{V}","vars":"單位體積的質量。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>密度描述「單位體積內包含多少質量」。</li><li>對質量為 $m$、體積為 $V$ 的物體，直接把總質量平均分配到體積上，就是 $m/V$。</li><li>因此定義 $\\rho=m/V$。</li><li>密度是材料的性質之一，在均勻物質近似下各部分密度相同；若物質不均勻，則更嚴格地應考慮局部密度 $\\rho=dm/dV$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意靜止／流動、不可壓縮與理想化假設；壓力、浮力與體積通常是局部量，不能混用不同位置或不同排開體積。</div></div></div>"},{"cat":"fluid","label":"流體","title":"壓力","formula":"P=\\frac{F}{A}","vars":"單位面積上的垂直力。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>壓力描述力分布在某個面積上時，單位面積受到多少垂直作用力。</li><li>若力 $F$ 均勻作用在面積 $A$ 上，單位面積平均承受的力為 $F/A$。</li><li>因此定義 $P=F/A$。</li><li>同樣大小的力若作用面積更小，壓力就更大；這就是尖端、刀刃等能產生大壓力的基本原因。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意靜止／流動、不可壓縮與理想化假設；壓力、浮力與體積通常是局部量，不能混用不同位置或不同排開體積。</div></div></div>"},{"cat":"fluid","label":"流體","title":"液體靜壓","formula":"P=P_0+\\rho gh","vars":"<b>$P_0$</b>：液面外加壓力","note":"深度越深壓力越大。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類把力學延伸到大量微觀粒子的集體行為。推導時最重要的是辨認面積、體積、液柱高度、排開流體體積，以及「靜止」或「理想流體」等條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>取液體中深度為 $h$ 的水平截面，假設上方液柱面積為 $A$。</li><li>液柱體積為 $Ah$，質量為 $\\rho Ah$，重量為 $\\rho Ahg$。</li><li>對液柱做鉛直方向受力平衡：底面受到的壓力力向上，頂面外界壓力 $P_0A$ 與液柱重量向下。</li><li>因此底面壓力滿足 $PA=P_0A+\\rho Ahg$，兩邊除以 $A$ 得 $P=P_0+\\rho gh$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>壓力隨深度增加的原因是上方液柱重量增加。式中的 $\rho gh$ 是液柱重量除以底面積後得到的壓力增加量。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>深度越深壓力越大。</div></div></div>"},{"cat":"fluid","label":"流體","title":"液體表壓","formula":"P_{\\rm gauge}=\\rho gh","vars":"相對外界壓力。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類把力學延伸到大量微觀粒子的集體行為。推導時最重要的是辨認面積、體積、液柱高度、排開流體體積，以及「靜止」或「理想流體」等條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>液體靜壓包含大氣或外界施加的基準壓力 $P_0$；如果我們只想知道「液體本身多增加了多少壓力」，就取壓力差。</li><li>由液體靜壓公式 $P=P_0+\\rho gh$。</li><li>兩邊減去 $P_0$，得到 $P-P_0=\\rho gh$。</li><li>定義表壓 $P_{\\rm gauge}=P-P_0$，因此 $P_{\\rm gauge}=\\rho gh$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意靜止／流動、不可壓縮與理想化假設；壓力、浮力與體積通常是局部量，不能混用不同位置或不同排開體積。</div></div></div>"},{"cat":"fluid","label":"流體","title":"帕斯卡原理／液壓機","formula":"\\frac{F_1}{A_1}=\\frac{F_2}{A_2}","vars":"密閉流體中的壓力可傳遞。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類把力學延伸到大量微觀粒子的集體行為。推導時最重要的是辨認面積、體積、液柱高度、排開流體體積，以及「靜止」或「理想流體」等條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>封閉液體受到外界壓力增加時，這個壓力變化會傳到液體各處。</li><li>在液壓機中，兩個活塞上的液體壓力相同，因此依 $P=F/A$ 可寫成 $F_1/A_1=F_2/A_2$。</li><li>因此 $F_2/F_1=A_2/A_1$：較大的活塞面積可以得到較大的輸出力。</li><li>這不代表能量被無中生有；大活塞移動的距離會相對較小，理想情況下輸入與輸出功仍然相等。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>真正守恆的是力所做的功（在理想、無損失情況下），因此小活塞較省力並不代表可以無中生有地放大能量。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意靜止／流動、不可壓縮與理想化假設；壓力、浮力與體積通常是局部量，不能混用不同位置或不同排開體積。</div></div></div>"},{"cat":"fluid","label":"流體","title":"阿基米德浮力","formula":"F_B=\\rho_{\\rm fluid}V_{\\rm displaced}g","vars":"浮力等於排開流體的重量。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 這一類把力學延伸到大量微觀粒子的集體行為。推導時最重要的是辨認面積、體積、液柱高度、排開流體體積，以及「靜止」或「理想流體」等條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>考慮一個浸在液體中的物體。液體壓力隨深度增加，因此物體底面受到的向上壓力力比上表面的向下壓力力更大。</li><li>把物體完全浸沒的情況視為一個被排開液體的體積 $V_{\\rm displaced}$；壓力差累積起來的淨向上力，數值等於被排開液體的重量。</li><li>被排開液體的質量為 $\\rho_{\\rm fluid}V_{\\rm displaced}$，因此其重量是 $\\rho_{\\rm fluid}V_{\\rm displaced}g$。</li><li>所以浮力 $F_B=\\rho_{\\rm fluid}V_{\\rm displaced}g$。關鍵是排開的是「流體的體積」，不是直接用物體總質量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>注意靜止／流動、不可壓縮與理想化假設；壓力、浮力與體積通常是局部量，不能混用不同位置或不同排開體積。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"攝氏與開爾文","formula":"T_K=T_C+273.15","vars":"熱力學公式應使用絕對溫度。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>開爾文溫標與攝氏溫標的每一度大小相同，但零點不同。</li><li>攝氏零度對應水的冰點附近，而絕對零度位於攝氏約 $-273.15^\\circ C$。</li><li>因此只要在攝氏溫度上加上 $273.15$，即可得到對應的絕對溫度：$T_K=T_C+273.15$。</li><li>理想氣體等公式中的溫度必須使用絕對溫標，因為那些比例關係的零點必須對應熱運動極限的絕對零度。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"波以耳定律","formula":"P_1V_1=P_2V_2","vars":"定溫、固定氣體量。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>固定氣體量與溫度時，實驗顯示氣體壓力與體積成反比：$P\\propto1/V$。</li><li>把比例改寫成等式，就有 $PV=\\text{constant}$。</li><li>比較同一份氣體狀態 1 與狀態 2，即得到 $P_1V_1=P_2V_2$。</li><li>適用條件是氣體量不變、溫度固定，並在理想氣體近似下使用最直接。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"
