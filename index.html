cat":"thermal","label":"熱學與氣體","title":"查理定律","formula":"\\frac{V_1}{T_1}=\\frac{V_2}{T_2}","vars":"定壓、固定氣體量。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>固定氣體量與壓力時，氣體體積與絕對溫度成正比：$V\\propto T$。</li><li>因此 $V/T$ 為常數。</li><li>比較兩個狀態得到 $V_1/T_1=V_2/T_2$。</li><li>這裡的溫度必須是開爾文，不能直接把攝氏數值代入比例式，因為攝氏零度不是熱力學的零點。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"給呂薩克定律","formula":"\\frac{P_1}{T_1}=\\frac{P_2}{T_2}","vars":"定容、固定氣體量。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>固定氣體量與體積時，壓力與絕對溫度成正比：$P\\propto T$。</li><li>因此壓力與溫度的比值保持不變：$P/T=\\text{constant}$。</li><li>比較兩個狀態得到 $P_1/T_1=P_2/T_2$。</li><li>使用時要保持體積與氣體量不變；若體積也改變，就應改用綜合氣體定律或理想氣體方程式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"綜合氣體定律","formula":"\\frac{P_1V_1}{T_1}=\\frac{P_2V_2}{T_2}","vars":"氣體量固定。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從理想氣體方程式 $PV=nRT$ 出發。對同一份氣體，$n$ 與 $R$ 固定，因此 $PV/T=nR$ 為常數。</li><li>所以任意兩個狀態 1、2 都滿足 $P_1V_1/T_1=P_2V_2/T_2$。</li><li>這個式子也可以看成波以耳、查理、給呂薩克等定律的統一表示。</li><li>前提是同一份氣體、氣體量不變，並以絕對溫度描述。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"理想氣體狀態方程","formula":"PV=nRT=Nk_BT","vars":"<b>$n$</b>：莫耳數 ｜ <b>$N$</b>：粒子數 ｜ <b>$R$</b>：氣體常數 ｜ <b>$k_B$</b>：波茲曼常數","note":"理想氣體模型的核心狀態方程。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>實驗上可分別觀察壓力、體積、溫度與氣體量之間的比例關係：$PV\\propto nT$。</li><li>把比例常數定義為普適氣體常數 $R$，得到 $PV=nRT$。</li><li>若把物質量換成粒子數 $N$，又有 $n=N/N_A$，因此 $PV=(N/N_A)RT$。</li><li>利用 $R=N_Ak_B$，便得到另一種形式 $PV=Nk_BT$。兩個形式只是用「莫耳數」或「粒子數」描述同一個理想氣體模型。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>理想氣體模型的核心狀態方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"理想氣體常數關係","formula":"R=N_Ak_B","vars":"連結莫耳尺度與單粒子尺度。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>理想氣體方程式可以用莫耳尺度寫成 $PV=nRT$，也可以用單粒子尺度寫成 $PV=Nk_BT$。</li><li>因為一莫耳包含 $N_A$ 個粒子，所以 $N=nN_A$。</li><li>把它代入粒子形式：$PV=nN_Ak_BT$。</li><li>與 $PV=nRT$ 比較，得到 $R=N_Ak_B$。這條關係只是把巨觀氣體常數與微觀玻茲曼常數連結起來。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"理想氣體密度","formula":"\\rho=\\frac{PM}{RT}","vars":"<b>$M$</b>：莫耳質量","note":"由理想氣體式與 $n=m/M$ 整理。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由理想氣體方程式 $PV=nRT$ 開始，並用莫耳數 $n$ 與莫耳質量 $M$ 的關係 $n=m/M$。</li><li>代入得到 $PV=(m/M)RT$。</li><li>整理質量：$m=PMV/(RT)$，再除以體積 $V$。</li><li>因 $\\rho=m/V$，得到 $\\rho=PM/(RT)$。這裡的 $M$ 使用與 $m$ 相同的質量單位系統，通常取 kg/mol。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由理想氣體式與 $n=m/M$ 整理。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"道耳頓分壓定律","formula":"P_{\\rm total}=\\sum_iP_i","vars":"理想混合氣體總壓力為各分壓之和。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>理想氣體混合物中，各種氣體可以近似獨立地對總壓力做貢獻。</li><li>對每一種成分 $i$，都可以用理想氣體方程式描述其在相同容器體積與溫度下的「分壓」。</li><li>因總氣體粒子數是各成分粒子數之和，總壓力也等於各成分分壓的代數和。</li><li>因此 $P_{\\rm total}=\\sum_iP_i$。若要求某成分分壓，先算出該成分單獨造成的壓力再相加即可。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"氣體動力論","formula":"P=\\frac13\\rho v_{\\rm rms}^2","vars":"由微粒碰撞器壁的動量通量建立。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把氣體視為大量做隨機運動、頻繁撞擊容器壁的微粒。單一粒子撞擊牆面時，動量方向改變，因而對牆施加力。</li><li>把大量粒子的碰撞效果做時間平均，可把壓力寫成粒子質量、粒子數密度與速度平方平均值的關係。</li><li>在三維各向同性的隨機運動下，$\\langle v_x^2\\rangle=\\langle v_y^2\\rangle=\\langle v_z^2\\rangle=\\frac13\\langle v^2\\rangle$。</li><li>因此得到 $P=\\frac13\\rho\\langle v^2\\rangle$。用方均根速率定義 $v_{\\rm rms}=\\sqrt{\\langle v^2\\rangle}$，就得到 $P=\\frac13\\rho v_{\\rm rms}^2$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"方均根速率（粒子質量）","formula":"v_{\\rm rms}=\\sqrt{\\frac{3k_BT}{m}}","vars":"<b>$m$</b>：單一粒子質量","note":"溫度與粒子平均運動尺度的關係。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由氣體動力論，$P=\\frac13\\rho v_{\\rm rms}^2$。</li><li>又因理想氣體的密度 $\\rho=Nm/V$，而理想氣體方程式給 $P=Nk_BT/V$。</li><li>將兩個 $P$ 相等：$Nk_BT/V=\\frac13(Nm/V)v_{\\rm rms}^2$。消掉 $N/V$。</li><li>得到 $k_BT=\\frac13mv_{\\rm rms}^2$，因此 $v_{\\rm rms}=\\sqrt{3k_BT/m}$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度與粒子平均運動尺度的關係。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"方均根速率（莫耳質量）","formula":"v_{\\rm rms}=\\sqrt{\\frac{3RT}{M}}","vars":"<b>$M$</b>：莫耳質量","note":"由 $m=M/N_A$ 與 $R=N_Ak_B$ 得到。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>上一張公式得到單粒子的形式 $v_{\\rm rms}=\\sqrt{3k_BT/m}$。</li><li>若改用一莫耳氣體，單粒子的質量 $m$ 要與莫耳質量 $M$ 和亞佛加厥常數 $N_A$ 連接：$m=M/N_A$。</li><li>代入：$v_{\\rm rms}=\\sqrt{3k_BT/(M/N_A)}=\\sqrt{3N_Ak_BT/M}$。</li><li>利用 $R=N_Ak_B$，得到 $v_{\\rm rms}=\\sqrt{3RT/M}$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由 $m=M/N_A$ 與 $R=N_Ak_B$ 得到。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"單原子理想氣體平均動能","formula":"\\langle K\\rangle=\\frac32k_BT","vars":"溫度可視為粒子平均平移動能尺度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從氣體動力論可得單一粒子平均平移動能與溫度成正比。結合 $P=\\frac13\\rho v_{\\rm rms}^2$ 與 $PV=Nk_BT$。</li><li>由兩式可得 $\\frac13mv_{\\rm rms}^2=k_BT$，而 $\\frac12mv_{\\rm rms}^2$ 正是平均平移動能。</li><li>因此 $\\langle K\\rangle=\\frac12m v_{\\rm rms}^2=\\frac32k_BT$。</li><li>這顯示絕對溫度本質上與微觀粒子平均平移運動的能量尺度直接相關；單原子氣體沒有額外的分子振動、轉動自由度。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"單原子理想氣體內能","formula":"U=\\frac32nRT","vars":"理想單原子氣體內能只取決於溫度。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>單原子理想氣體的內能主要由粒子的隨機平移動能構成。</li><li>單一粒子的平均動能是 $\\frac32k_BT$，若有 $N$ 個粒子，總內能為 $U=N\\frac32k_BT$。</li><li>因 $N=nN_A$，得到 $U=\\frac32nN_Ak_BT$。</li><li>利用 $R=N_Ak_B$，最後得到 $U=\\frac32nRT$。對理想氣體而言，內能只與溫度有關；這個簡式限定在單原子理想氣體模型。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"熱量","formula":"Q=mc\\Delta T","vars":"<b>$c$</b>：比熱","note":"沒有相變且比熱可視為常數。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 熱學公式非常依賴條件：定溫、定壓、定容、理想氣體、符號約定等。推導時要先確認狀態條件，再使用狀態方程或熱力學第一定律。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若物體溫度改變、沒有相變，吸收或放出的熱量可與溫度變化成正比。</li><li>實驗上比例與物體質量及材料的比熱 $c$ 有關。質量越大，同樣升高 $1^\\circ C$ 通常需要更多能量。</li><li>所以定義關係 $Q\\propto mc\\Delta T$，取比例常數為 $1$ 後得到 $Q=mc\\Delta T$。</li><li>這條式子不適用於正在發生相變的階段；相變時溫度可保持近似不變，應改用 $Q=mL$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>沒有相變且比熱可視為常數。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"熱容量","formula":"C=\\frac{Q}{\\Delta T}","vars":"單位溫升所需熱量。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>熱容量描述「讓一個物體的溫度改變一度需要多少熱量」。</li><li>依定義，物體吸收熱量 $Q$ 使溫度改變 $\\Delta T$，則 $C=Q/\\Delta T$。</li><li>若材料均勻且質量為 $m$、比熱為 $c$，因 $Q=mc\\Delta T$，可得到 $C=mc$。</li><li>因此熱容量與整個物體的大小有關，而比熱 $c$ 則是材料本身的單位質量特性。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"比熱","formula":"c=\\frac{Q}{m\\Delta T}","vars":"單位質量升高一度所需熱量。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>比熱定義為「單位質量的物質，溫度改變一度所需的熱量」。</li><li>從熱量公式 $Q=mc\\Delta T$ 出發，把 $m\\Delta T$ 移到右側分母。</li><li>得到 $c=Q/(m\\Delta T)$。</li><li>所以在相同質量與相同溫度變化下，比熱越大的材料需要吸收越多熱量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"潛熱","formula":"Q=mL","vars":"<b>$L$</b>：比潛熱","note":"發生相變時使用。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>發生相變時，例如熔化或汽化，能量主要用來改變物質內部結構，而溫度不一定隨吸熱量上升。</li><li>實驗上在固定相變種類與壓力下，完成相變所需熱量與參與相變的質量成正比。</li><li>把單位質量所需能量定義為潛熱 $L$，便得到 $Q=mL$。</li><li>因此潛熱公式使用的是相變質量，不是單純的溫度變化；若同時還有升溫或降溫，必須把不同階段的熱量分段計算。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>發生相變時使用。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"熱力學第一定律（系統對外作功為正）","formula":"\\Delta U=Q-W","vars":"能量守恆在熱力學系統的形式。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>熱力學第一定律本質上就是能量守恆：系統吸收的熱量可增加內能，也可以拿去對外作功。</li><li>若系統吸收熱量 $Q>0$，而系統對外作功 $W>0$，則留下來增加內能的部分就是 $Q-W$。</li><li>因此內能變化為 $\\Delta U=Q-W$。</li><li>符號 convention 很重要：這張卡採用「系統對外作功為正」。若教材採用外界對系統作功為正，就會得到下一張卡的 $\\Delta U=Q+W_{\\rm on}$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>最容易出錯的是功的正負號。這裡約定「系統對外作功」為正，因此系統失去的機械功會從內能中扣除。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"thermal","label":"熱學與氣體","title":"熱力學第一定律（外界對系統作功為正）","formula":"\\Delta U=Q+W_{\\rm on}","vars":"只是功的正負號約定不同。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>仍從能量守恆出發：系統內能增加，可以來自吸收熱量，也可以來自外界對系統作功。</li><li>若定義 $W_{\\rm on}>0$ 表示外界對系統輸入能量做功，那麼熱量輸入為 $Q$、功輸入為 $W_{\\rm on}$。</li><li>兩者都增加系統內能，所以 $\\Delta U=Q+W_{\\rm on}$。</li><li>與上一張卡相比，兩個式子只差在功的正負號慣例，不是兩個互相衝突的物理定律。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>與另一張卡只是符號約定不同，不是物理定律不同。看到熱力學第一定律時，第一件事應該確認課本採用的是哪一種 $W$ 正負號定義。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>溫度若出現在比例式中通常必須用絕對溫度 K；另外要確認過程是定溫、定壓、定容，或需要使用完整的理想氣體方程。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"波速關係","formula":"v=f\\lambda","vars":"波速等於頻率乘波長。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>一個波在時間 $T$ 內前進一個波長 $\\lambda$，因此波速等於一個波長除以一個週期。</li><li>所以 $v=\\lambda/T$。</li><li>又因頻率定義為 $f=1/T$，代入得到 $v=f\\lambda$。</li><li>這條關係描述週期性波的波峰傳播速度；不要把波速與介質中粒子本身振動的速度混為一談。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"頻率與週期","formula":"f=\\frac1T","vars":"頻率與週期互為倒數。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>週期 $T$ 定義為完成一次完整週期所需的時間。</li><li>頻率 $f$ 定義為單位時間內完成的週期數。</li><li>因此一個週期花 $T$ 秒，就表示每秒完成 $1/T$ 個週期。</li><li>所以得到 $f=1/T$，兩者互為倒數；一個週期越久，頻率就越低。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"角頻率","formula":"\\omega=2\\pi f","vars":"一週期相位增加 $2\\pi$。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>普通頻率 $f$ 表示每秒完成幾個週期；一個完整週期在相位上增加 $2\\pi$ 弧度。</li><li>因此每秒相位改變量為「每秒幾圈」乘上「每圈 $2\\pi$ 弧度」：$\\omega=2\\pi f$。</li><li>也因 $f=1/T$，得到 $\\omega=2\\pi/T$。</li><li>角頻率的單位是 rad/s；弧度是無因次角度單位，但角頻率仍習慣寫成 rad/s 以強調它代表每秒相位改變多少。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"波數","formula":"k=\\frac{2\\pi}{\\lambda}","vars":"單位長度的相位變化率。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>波數描述空間中相位變化的快慢，和角頻率描述時間中相位變化的快慢相對應。</li><li>沿空間前進一個波長 $\\lambda$，相位增加 $2\\pi$。</li><li>因此單位距離的相位改變量為 $2\\pi/\\lambda$。</li><li>定義波數 $k=2\\pi/\\lambda$，所以波數越大，代表波長越短、空間振盪越快。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"簡諧行波方程","formula":"y=A\\sin(kx-\\omega t+\\phi)","vars":"<b>$A$</b>：振幅 ｜ <b>$\\phi$</b>：初相位","note":"以正弦函數表達週期性的空間與時間變化。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>先看固定位置的簡諧振動，可以用 $y=A\\sin(\\omega t+\\phi)$ 描述。</li><li>若整個圖形以速度 $v$ 向 $+x$ 方向平移，某位置 $x$ 在時間 $t$ 所感受到的振動，相當於波源在更早的時間 $t-x/v$ 所做的運動。</li><li>代入後得到相位 $\\omega(t-x/v)+\\phi=\\omega t-(\\omega/v)x+\\phi$。因 $v=\\omega/k$，可寫成 $kx-\\omega t$ 的等價相位形式；選擇相反的整體符號只對應不同的傳播方向／正弦相位約定。</li><li>因此常見形式可寫為 $y=A\\sin(kx-\\omega t+\\phi)$，其中 $A$ 決定振幅、$k$ 決定波長、$\\omega$ 決定週期、$\\phi$ 決定初始相位。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>以正弦函數表達週期性的空間與時間變化。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"波的相位差","formula":"\\Delta\\phi=\\frac{2\\pi}{\\lambda}\\Delta x","vars":"空間相差一個波長即相差 $2\\pi$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>同一列行波在不同位置的相位差來自波峰、波谷在空間上的週期性排列。</li><li>相隔一個波長 $\\lambda$ 的兩點，振動狀態完全相同，因此相位差增加 $2\\pi$。</li><li>相隔 $\\Delta x$ 時，依比例關係，相位差為 $2\\pi(\\Delta x/\\lambda)$。</li><li>因此 $\\Delta\\phi=\\frac{2\\pi}{\\lambda}\\Delta x$。這條式子假設比較的是同一時刻、同一傳播波的兩個位置。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"路徑差與相位差","formula":"\\Delta\\phi=\\frac{2\\pi\\Delta r}{\\lambda}","vars":"將路徑差換成相位差。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>干涉問題中，兩條路徑的長度差會讓兩個波抵達同一點時具有不同的相位。</li><li>波每前進一個波長，經歷一個完整週期，也就是相位增加 $2\\pi$。</li><li>因此路徑多出的 $\\Delta r$ 相對於一個波長的比例為 $\\Delta r/\\lambda$ 個週期。</li><li>乘上每週期 $2\\pi$，得到 $\\Delta\\phi=2\\pi\\Delta r/\\lambda$。若還有額外的反射相位變化，則需另外把那個相位差加入。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"繩波速率","formula":"v=\\sqrt{\\frac{T}{\\mu}}","vars":"<b>$T$</b>：繩張力 ｜ <b>$\\mu$</b>：線密度","note":"張力越大越快，線密度越大越慢。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對一條張力為 $T$、線密度為 $\\mu$ 的繩子，波速取決於「拉得有多緊」與「每單位長度有多重」。</li><li>取繩上一小段長度 $\\Delta x$。波形彎曲時，張力的兩個分量形成近似恢復力；在小振幅、小斜率近似下，牛頓第二定律可得到波動方程。</li><li>由這個波動方程與標準波方程 $\\partial^2y/\\partial t^2=v^2\\partial^2y/\\partial x^2$ 比較係數，可得 $v^2=T/\\mu$。</li><li>所以 $v=\\sqrt{T/\\mu}$。張力越大波越快，線越重（$\\mu$ 越大）則波越慢。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>張力越大越快，線密度越大越慢。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"線密度","formula":"\\mu=\\frac{m}{L}","vars":"單位長度質量。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>線密度就是「單位長度包含多少質量」，和體密度 $\\rho=m/V$ 的概念完全類似，只是把體積換成長度。</li><li>一段均勻繩長為 $L$、總質量為 $m$，因此單位長度的質量就是 $m/L$。</li><li>定義 $\\mu=m/L$。</li><li>代入繩波速率公式後即可直接看出，固定張力時線密度越大，波速越低。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"兩端固定弦駐波條件","formula":"L=n\\frac{\\lambda}{2}","vars":"$n=1,2,3,\\ldots$","note":"兩端皆為節點。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>兩端固定表示兩端位移都必須永遠為零，因此兩端必須是波節。</li><li>相鄰波節之間的距離等於半個波長 $\\lambda/2$。</li><li>若弦長 $L$ 中容納了 $n$ 個半波長，則 $L=n\\lambda/2$，其中 $n=1,2,3,\\ldots$。</li><li>這個條件來自邊界條件；不是任何一條弦都可以任意選擇波長，只有滿足這些離散條件的模式才能穩定形成駐波。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>兩端皆為節點。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"兩端固定弦第 $n$ 階波長","formula":"\\lambda_n=\\frac{2L}{n}","vars":"由駐波條件整理。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由兩端固定弦的駐波條件 $L=n\\lambda/2$ 出發。</li><li>兩邊乘以 $2$：$2L=n\\lambda$。</li><li>再除以 $n$，得到 $\\lambda_n=2L/n$。</li><li>所以階數越高，允許的波長越短；$n=1$ 就是最長波長的基頻模式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"兩端固定弦第 $n$ 階頻率","formula":"f_n=\\frac{nv}{2L}","vars":"由 $v=f\\lambda$ 代入。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>波速關係為 $v=f\\lambda$，所以頻率可以寫成 $f=v/\\lambda$。</li><li>第 $n$ 階波長為 $\\lambda_n=2L/n$。</li><li>代入：$f_n=v/(2L/n)=nv/(2L)$。</li><li>因此固定弦上各次諧波頻率是基頻的整數倍：$f_n=nf_1$。這裡假設弦上的波速固定。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"兩端固定弦基頻","formula":"f_1=\\frac{v}{2L}","vars":"取 $n=1$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>基頻就是最低階、$n=1$ 的駐波模式。</li><li>由第 $n$ 階頻率 $f_n=nv/(2L)$，令 $n=1$。</li><li>得到 $f_1=v/(2L)$。</li><li>這一階波長最長，為 $\\lambda_1=2L$；因此基頻決定樂器弦的基本音高。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"開管共鳴條件","formula":"L=n\\frac{\\lambda}{2}","vars":"兩端均可形成波腹。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>兩端開放的管口近似都是位移腹（壓力節），因此穩定駐波必須在兩端同時滿足開放端邊界條件。</li><li>相鄰同相的位移腹之間對應半個波長，因此整支管長可以容納整數個半波長。</li><li>得到 $L=n\\lambda/2$，其中 $n=1,2,3,\\ldots$。</li><li>所以理想開管可以出現基頻以及整數次諧波；實際樂器還會受到端點修正等因素影響。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"開管第 $n$ 階頻率","formula":"f_n=\\frac{nv}{2L}","vars":"由共鳴條件與波速公式得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由開管共鳴條件 $L=n\\lambda/2$，得到 $\\lambda_n=2L/n$。</li><li>再使用波速關係 $v=f\\lambda$，得 $f_n=v/\\lambda_n$。</li><li>代入波長後得到 $f_n=nv/(2L)$。</li><li>因此理想開管的頻率序列與兩端固定弦的數學形式相同，但其邊界物理意義不同。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"閉管共鳴條件","formula":"L=(2n-1)\\frac{\\lambda}{4}","vars":"一端節一端腹，只出現奇次諧波。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>一端封閉、一端開放的管子，其兩端邊界條件不同：封閉端近似是位移節，開放端近似是位移腹。</li><li>從節到最近的腹距離是 $\\lambda/4$；之後每增加一個完整波長又會得到下一個允許模式。</li><li>因此 $L=(2n-1)\\lambda/4$，其中 $n=1,2,3,\\ldots$。</li><li>因為只允許奇數個四分之一波長，所以理想閉管只有奇次諧波。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"閉管第 $n$ 階頻率","formula":"f_n=\\frac{(2n-1)v}{4L}","vars":"由閉管共鳴條件得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由閉管條件 $L=(2n-1)\\lambda/4$，解出 $\\lambda_n=4L/(2n-1)$。</li><li>使用 $v=f\\lambda$，所以 $f_n=v/\\lambda_n$。</li><li>代入得到 $f_n=(2n-1)v/(4L)$。</li><li>令 $n=1$ 得基頻 $v/(4L)$，下一個允許模式不是第二諧波，而是第三諧波，這正是閉管頻譜的特徵。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"拍頻","formula":"f_{\\rm beat}=|f_1-f_2|","vars":"兩頻率接近的波疊加產生振幅週期性變化。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>兩個頻率很接近的波疊加時，某些時刻同相而振幅變大，某些時刻反相而振幅變小，因此聽到週期性的強弱變化。</li><li>設兩波頻率為 $f_1$ 與 $f_2$，它們的相位差會以兩者頻率差的速率變化。</li><li>因此振幅包絡的變化頻率就是 $|f_1-f_2|$。</li><li>所以拍頻 $f_{\\rm beat}=|f_1-f_2|$。當兩頻率完全相同時拍頻為零。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"都卜勒效應","formula":"f'=f\\frac{v\\pm v_o}{v\\mp v_s}","vars":"<b>$v_o$</b>：觀察者速度 ｜ <b>$v_s$</b>：聲源速度 ｜ 符號依相對運動方向判定","note":"相對運動造成接收頻率改變。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>都卜勒效應來自「波源與觀察者的相對運動，使單位時間內觀察到的波峰數改變」。</li><li>若觀察者朝向波源移動，他每秒遇到更多波峰，因此觀察頻率增加；若遠離，則頻率降低。這產生分子中的 $v\\pm v_o$。</li><li>若波源移動，會改變相鄰波峰在傳播方向上的間距，也就是觀察到的波長；因此分母出現 $v\\mp v_s$。</li><li>把兩種效果合併得到 $f\\'=f\\frac{v\\pm v_o}{v\\mp v_s}$。正負號必須依「觀察者與波源靠近或遠離」的實際方向判斷；不能四個符號全部任意選。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>公式中的正負號不能死背成一組固定符號；應先判斷「觀察者是否朝向聲源」與「聲源是否朝向觀察者」，再依相對運動方向決定頻率升高還是降低。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>相對運動造成接收頻率改變。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"相長干涉","formula":"\\Delta r=n\\lambda","vars":"$n=0,1,2,\\ldots$","note":"兩波同相疊加。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>兩個相干波抵達同一點時，若相位差為整數個 $2\\pi$，一個波的波峰會對上另一個波的波峰，波谷也對上波谷。</li><li>相位差為 $\\Delta\\phi=2\\pi\\Delta r/\\lambda$。</li><li>相長條件是 $\\Delta\\phi=2\\pi n$，其中 $n$ 為整數。</li><li>代入後得到 $\\Delta r=n\\lambda$。也就是兩條路徑差剛好是整數個波長。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>兩波同相疊加。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"相消干涉","formula":"\\Delta r=\\left(n+\\frac12\\right)\\lambda","vars":"$n=0,1,2,\\ldots$","note":"兩波相差半波長奇數倍。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>相消干涉發生在兩波相差半個週期的奇數倍時，此時一個波峰對上一個波谷。</li><li>因此相位差滿足 $\\Delta\\phi=(2n+1)\\pi=2\\pi(n+1/2)$。</li><li>利用 $\\Delta\\phi=2\\pi\\Delta r/\\lambda$，得到 $\\Delta r=(n+1/2)\\lambda$。</li><li>這個條件假設兩波振幅相近；若振幅不同，總振幅仍會減小，但不一定完全抵消。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>兩波相差半波長奇數倍。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"折射率","formula":"n=\\frac{c}{v}","vars":"描述光在介質中的傳播速度相對於真空光速。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>光在真空中的速度記為 $c$，進入介質後速度通常變慢，記為 $v$。</li><li>折射率定義為真空光速與介質中光速的比值。</li><li>因此 $n=c/v$。</li><li>因為真空中的 $c$ 最大，所以透明介質通常有 $n>1$。對同一頻率的光，進入介質後波長會依 $v=f\\lambda$ 一起改變，但頻率由邊界條件保持一致。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"史乃耳折射定律","formula":"n_1\\sin\\theta_1=n_2\\sin\\theta_2","vars":"<b>$\\theta_1,\\theta_2$</b>：相對法線的角度","note":"介面兩側波動條件導出。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>惠更斯原理把光波在界面上的傳播看成波前逐點延伸。當光進入另一介質，波速改變，但在平面界面上頻率保持不變。</li><li>幾何關係可得到 $\\sin\\theta_1/\\sin\\theta_2=v_1/v_2$。</li><li>因折射率定義 $n=c/v$，所以 $v_1/v_2=n_2/n_1$。</li><li>整理後得到 $n_1\\sin\\theta_1=n_2\\sin\\theta_2$。角度都是相對法線量測；若從低折射率進入高折射率，光線會向法線偏折。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>介面兩側波動條件導出。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"全反射臨界角","formula":"\\sin\\theta_c=\\frac{n_2}{n_1}","vars":"<b>$n_1>n_2$</b>","note":"臨界時折射角為 $90^\\circ$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>全反射只能發生在光從高折射率介質 $n_1$ 射向低折射率介質 $n_2$，且 $n_1>n_2$。</li><li>隨入射角增加，折射角依史乃耳定律增加；在臨界狀態，折射光沿界面前進，因此折射角 $\\theta_2=90^\\circ$。</li><li>代入 $n_1\\sin\\theta_c=n_2\\sin90^\\circ$，得到 $n_1\\sin\\theta_c=n_2$。</li><li>所以 $\\sin\\theta_c=n_2/n_1$。若入射角再更大，就不存在滿足折射定律的折射角，理想情況下發生全反射。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>全反射只能由高折射率介質射向低折射率介質時發生。若入射角大於臨界角才會全反射；等於臨界角時折射光沿界面前進。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>臨界時折射角為 $90^\\circ$。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"反射定律","formula":"\\theta_i=\\theta_r","vars":"入射角等於反射角，皆相對法線。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>平面界面上的反射光仍受幾何對稱性約束。根據波前或光程原理，反射後的方向相對法線與入射方向對稱。</li><li>因此入射光線與法線的夾角定義為入射角 $\\theta_i$，反射光線與法線夾角為反射角 $\\theta_r$。</li><li>兩者相等：$\\theta_i=\\theta_r$。</li><li>角度一定是相對法線量測，不是相對界面本身量測。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"薄透鏡／球面鏡成像公式","formula":"\\frac1f=\\frac1{d_o}+\\frac1{d_i}","vars":"<b>$d_o$</b>：物距 ｜ <b>$d_i$</b>：像距 ｜ <b>$f$</b>：焦距","note":"採常見符號慣例的成像關係。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>這個成像關係可由近軸光線幾何得到。對薄透鏡，考慮平行於主軸的近軸光線經焦點折射，以及通過光心近似直線的光線，可以建立物距、像距與焦距的相似三角形關係。</li><li>整理幾何比例後得到共軛關係 $1/f=1/d_o+1/d_i$。其中 $d_o$、$d_i$ 的正負要依教材採用的符號規則判斷。</li><li>球面鏡在近軸近似下也能得到相同形式，因為曲率半徑與焦距存在 $f=R/2$ 的關係。</li><li>這不是任意厚透鏡的精確通式；它依賴薄透鏡／近軸幾何等近似，因此若不符合適用條件就不能直接套用。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>採常見符號慣例的成像關係。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"放大率","formula":"m=\\frac{h_i}{h_o}=-\\frac{d_i}{d_o}","vars":"<b>$h_o,h_i$</b>：物高、像高","note":"負號反映常見符號慣例中的倒立。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由物體高度 $h_o$ 與像高 $h_i$ 定義線性放大率 $m=h_i/h_o$。</li><li>再用近軸成像的相似三角形，物高與物距之比等於像高與像距之比，但依符號慣例倒立像會帶負號。</li><li>因此常用符號系統下得到 $m=-d_i/d_o$。</li><li>所以一張卡中的 $m=h_i/h_o=-d_i/d_o$ 同時包含「幾何大小比例」與「正負號代表正立／倒立」兩個資訊。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>負號反映常見符號慣例中的倒立。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"球面鏡焦距","formula":"f=\\frac R2","vars":"<b>$R$</b>：曲率半徑","note":"近軸近似下成立。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對近軸光線照射球面鏡，球面鏡的曲率中心到鏡面的距離為曲率半徑 $R$。</li><li>由球面幾何與反射定律，可證明近軸平行光線反射後會在球面頂點與曲率中心之間約一半的位置會聚。</li><li>因此焦點到鏡面的焦距為 $f=R/2$。</li><li>這是近軸近似結果；離軸很大的光線會出現球面像差，就不再能用「所有光線都在同一焦點」的簡化圖像。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>近軸近似下成立。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"雙狹縫路徑差","formula":"\\Delta r=d\\sin\\theta","vars":"由幾何關係得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>兩狹縫間距為 $d$，遠處觀察點與中央方向夾角為 $\\theta$。從兩狹縫到該點的兩條路徑長不同。</li><li>在遠場近似下，這段路徑差等於狹縫間距在傳播方向上的投影。</li><li>幾何投影得到 $\\Delta r=d\\sin\\theta$。</li><li>因此角度越大，兩路徑的差距越大；這是後續建立亮暗紋條件的幾何基礎。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"雙狹縫小角度路徑差","formula":"\\Delta r\\approx d\\frac{y}{L}","vars":"使用 $\\sin\theta\u0007pprox\tan\theta\u0007pprox y/L$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由精確幾何關係 $\\Delta r=d\\sin\\theta$ 出發。</li><li>當屏幕距離 $L$ 很大、條紋位置 $y$ 遠小於 $L$ 時，可以用小角度近似 $\\sin\\theta\\approx\\tan\\theta\\approx y/L$。</li><li>代入得到 $\\Delta r\\approx d(y/L)$。</li><li>因此這個公式是雙狹縫遠場、小角度條件下的近似；不是任意幾何距離都能直接使用。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"雙狹縫明紋","formula":"d\\sin\\theta=m\\lambda","vars":"$m=0,\\pm1,\\pm2,\\ldots$","note":"相長干涉的條件。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>明紋表示兩狹縫來的波在該位置相長干涉，因此路徑差必須是整數個波長。</li><li>相長條件為 $\\Delta r=m\\lambda$，其中 $m=0,\\pm1,\\pm2,\\ldots$ 表示中央明紋與各階明紋。</li><li>再代入雙狹縫路徑差 $\\Delta r=d\\sin\\theta$。</li><li>得到 $d\\sin\\theta=m\\lambda$。若屏幕很遠，再搭配 $\\sin\\theta\\approx y/L$ 就可得到條紋位置。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>相長干涉的核心不是「亮紋公式本身」，而是兩波到達觀察點時的相位差為 $2m\\pi$，等價於路徑差為整數倍波長。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>相長干涉的條件。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"雙狹縫暗紋","formula":"d\\sin\\theta=\\left(m+\\frac12\\right)\\lambda","vars":"$m=0,\\pm1,\\pm2,\\ldots$","note":"相消干涉的條件。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>暗紋表示兩狹縫的波在該位置相消干涉，因此路徑差為半個波長的奇數倍。</li><li>相消條件是 $\\Delta r=(m+1/2)\\lambda$。</li><li>代入幾何路徑差 $\\Delta r=d\\sin\\theta$，得到 $d\\sin\\theta=(m+1/2)\\lambda$。</li><li>所以明暗紋只差半個波長的相位條件；中央位置 $\\theta=0$ 對應零階明紋，而不會是暗紋。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>相消干涉需要相位差為 $(2m+1)\\pi$，因此路徑差必須是半整數倍波長。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>相消干涉的條件。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"雙狹縫條紋間距","formula":"\\Delta y=\\frac{\\lambda L}{d}","vars":"小角度近似下的相鄰條紋距離。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>小角度時，明紋位置由 $d\\sin\\theta=m\\lambda$ 與 $\\sin\\theta\\approx y/L$ 給出。</li><li>因此 $dy/L\\approx m\\lambda$，得到第 $m$ 階明紋位置 $y_m\\approx m\\lambda L/d$。</li><li>相鄰兩條明紋位置差為 $y_{m+1}-y_m\\approx\\lambda L/d$。</li><li>所以條紋間距 $\\Delta y=\\lambda L/d$。它告訴我們：波長越長、屏距越大，條紋越寬；狹縫越遠，條紋越密。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"單狹縫繞射暗紋","formula":"a\\sin\\theta=m\\lambda","vars":"$m=1,2,3,\\ldots$","note":"特定方向的次波互相抵消。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>單狹縫可看成狹縫內許多相鄰的小波源。不同位置的小波源到觀察點的路徑不同，因此可以彼此干涉。</li><li>對狹縫寬度 $a$、觀察角 $\\theta$，狹縫兩端的最大路徑差為 $a\\sin\\theta$。</li><li>若此路徑差為一個整數倍波長 $m\\lambda$，可以把狹縫分成成對區域，使每對波彼此抵消，形成暗紋。</li><li>因此暗紋條件為 $a\\sin\\theta=m\\lambda$，其中 $m=1,2,3,\\ldots$；這是單狹縫繞射的常用近似條件。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這個結果不是把雙狹縫直接改成一條縫，而是把狹縫內不同位置發出的次波互相配對後，利用完全相消的幾何條件得到。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>特定方向的次波互相抵消。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"單狹縫暗紋位置近似","formula":"y_m\\approx\\frac{m\\lambda L}{a}","vars":"小角度近似。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由單狹縫暗紋條件 $a\\sin\\theta=m\\lambda$ 出發。</li><li>若屏幕距離 $L$ 遠且繞射角小，可用 $\\sin\\theta\\approx y/L$。</li><li>因此 $a(y/L)\\approx m\\lambda$。</li><li>解得 $y_m\\approx m\\lambda L/a$。正負號分別對應中央亮紋左右兩側的對稱位置。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"wave","label":"波動與光學","title":"單狹縫中央亮紋寬度","formula":"\\Delta y_{\\rm central}\\approx\\frac{2\\lambda L}{a}","vars":"中央亮紋兩側第一暗紋的距離。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 波動公式的共同骨架是「週期、頻率、波長、波速、相位」。在干涉、繞射、駐波與光學中，真正重要的是先建立幾何上的路徑差，再把路徑差轉成相位條件。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>中央亮紋兩側的第一暗紋對應 $m=\\pm1$。</li><li>由第一暗紋位置近似，正側位置約為 $y_1=\\lambda L/a$，負側為 $-\\lambda L/a$。</li><li>中央亮紋寬度就是兩個第一暗紋之間的距離，因此 $\\Delta y_{\\rm central}=y_1-(-y_1)=2\\lambda L/a$。</li><li>所以單狹縫中央亮紋大約是一般相鄰亮紋區域的兩倍寬，這也是單狹縫繞射圖樣很容易辨認的特徵。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認介質、波長、頻率與觀察方向，再判斷相位差、路徑差與邊界條件；不同端點條件會導致不同駐波公式。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電量量子化","formula":"q=ne","vars":"$n\\in\\mathbb Z$，$e$：基本電荷量大小","note":"電荷以基本電荷為離散單位。","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>基本電荷 $e$ 是自然界中帶電性的基本尺度之一。電子帶電量為 $-e$，質子為 $+e$。</li><li>在一般物質的宏觀帶電狀態中，總電量來自大量基本電荷的累積，因此電荷量以整數倍的基本電荷出現。</li><li>所以寫成 $q=ne$，其中 $n$ 為整數；若考慮電子，$n$ 可用正負號表示帶電方向。</li><li>這是一個量子化關係，不是在說所有可能的電荷都只能是正數；正負只代表淨電量的符號。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>電荷以基本電荷為離散單位。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"庫侖定律","formula":"F=k\\frac{|q_1q_2|}{r^2}","vars":"<b>$k$</b>：靜電力常數","note":"兩點電荷的靜電力關係。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>實驗顯示兩點電荷之間的靜電力與電荷量乘積成正比：$F\\propto|q_1q_2|$。</li><li>同時，力的大小與兩電荷距離平方成反比：$F\\propto1/r^2$。</li><li>合併得到 $F\\propto|q_1q_2|/r^2$，並把比例常數定義為 $k$。</li><li>因此 $F=k|q_1q_2|/r^2$。真正的力方向則由電荷正負決定：同號互斥、異號相吸。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>兩點電荷的靜電力關係。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電場定義","formula":"\\vec E=\\frac{\\vec F}{q}","vars":"單位正試驗電荷所受的力。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>要描述一個電荷在空間中對其他電荷造成的作用，可以把「受力」除以測試電荷本身。</li><li>在某點放置一個足夠小、不致明顯改變原電場的測試電荷 $q$，測得它受到力 $\\vec F$。</li><li>定義該點電場為單位正電荷所受力：$\\vec E=\\vec F/q$。</li><li>因此對任意電荷置於該點，都可以用 $\\vec F=q\\vec E$ 求力；電場本身是空間的性質，不依賴後來放入的測試電荷。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"點電荷電場","formula":"E=k\\frac{|Q|}{r^2}","vars":"由庫侖定律除以試驗電荷得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分成兩條互相連接的描述：用力與電場描述「電荷受到什麼作用」，用電位與能量描述「每單位電荷有多少能量」。電路則再加入電流、電阻與節點／迴路守恆。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從庫侖定律開始，一個源電荷 $Q$ 與測試電荷 $q$ 距離 $r$ 時，受力大小為 $F=k|Qq|/r^2$。</li><li>電場定義為 $E=F/|q|$，所以把測試電荷的大小約掉。</li><li>得到 $E=k|Q|/r^2$。方向則沿著源電荷與觀察點的連線：正電荷向外、負電荷向內。</li><li>因此電場強度與測試電荷大小無關，只由產生電場的源電荷與空間位置決定。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電場中的電力","formula":"\\vec F=q\\vec E","vars":"由電場定義直接整理。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>電場的定義為 $\\vec E=\\vec F/q$。</li><li>兩邊同乘 $q$，即可得到 $\\vec F=q\\vec E$。</li><li>對正電荷，力方向與電場方向相同；對負電荷，因 $q<0$，力方向與電場相反。</li><li>所以不要把電場方向和負電荷所受力方向直接畫成相同；真正決定力方向的是 $q\\vec E$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認電量正負與座標方向；向量電場／電力不能只看大小。電位則是標量，可以直接做代數疊加。</div></div></div>"},{"cat":"electro","label":"靜電與電路","title":"電場疊加原理","formula":"\\vec E_{\\rm net}=\\sum_i\\vec E_i","vars":"各電荷造成的電場向量相加。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 電學可分
