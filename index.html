p-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這條式子同時包含三件事：光子提供 $hf$、金屬先付出功函數 $\\phi$、剩餘才成為光電子最大動能。光強主要影響光電子數量，不直接決定單顆電子的最大動能。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>光子能量分成克服功函數與電子動能。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"光電子最大動能","formula":"K_{\\max}=hf-\\phi","vars":"由光電方程整理。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從愛因斯坦光電方程 $hf=\\phi+K_{\\max}$ 出發。</li><li>兩邊減去功函數 $\\phi$，得到 $K_{\\max}=hf-\\phi$。</li><li>因此增加光頻率會增加光電子最大動能，而增加光強在頻率固定時主要增加光電子數量。</li><li>只有當 $hf\\ge\\phi$ 時，才會有光電子逸出；低於臨界頻率時，即使增加光強也不能靠單一光子提供足夠能量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"遏止電壓","formula":"K_{\\max}=eV_s","vars":"遏止電壓的電位能差抵消最大初動能。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>遏止電壓 $V_s$ 是讓最快的光電子也剛好無法抵達集電極的反向電壓。</li><li>電子通過電位差所需克服的電位能差大小為 $eV_s$，在臨界狀態剛好等於最大初動能。</li><li>因此 $K_{\\max}=eV_s$。</li><li>再與光電方程聯立可得到 $eV_s=hf-\\phi$，這也是用實驗直線圖測量 $h$ 與功函數的方法。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"光電效應線性關係","formula":"K_{\\max}=h(f-f_0)","vars":"<b>$f_0$</b>：臨界頻率","note":"代入 $\\phi=hf_0$。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從光電方程 $K_{\\max}=hf-\\phi$ 出發。</li><li>臨界頻率 $f_0$ 定義為光子剛好能克服功函數，因此 $hf_0=\\phi$。</li><li>把 $\\phi=hf_0$ 代回：$K_{\\max}=hf-hf_0$。</li><li>提出共同因子 $h$，得到 $K_{\\max}=h(f-f_0)$。所以 $K_{\\max}$ 對 $f$ 的圖是一條斜率為 $h$ 的直線。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>代入 $\\phi=hf_0$。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"臨界頻率","formula":"f_0=\\frac{\\phi}{h}","vars":"光子能量剛好等於功函數。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在光電效應剛好發生的臨界狀態，逸出的電子最大初動能剛好為零。</li><li>因此愛因斯坦方程變成 $hf_0=\\phi+0$。</li><li>兩邊除以 $h$，得到 $f_0=\\phi/h$。</li><li>所以功函數越大的金屬，需要越高的最低光頻率才能產生光電效應。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"臨界波長","formula":"\\lambda_0=\\frac{hc}{\\phi}","vars":"由 $f_0=c/\\lambda_0$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>臨界狀態滿足光子能量 $hf_0=\\phi$。</li><li>真空中 $f_0=c/\\lambda_0$。</li><li>代入：$hc/\\lambda_0=\\phi$。</li><li>整理得到 $\\lambda_0=hc/\\phi$。由此可知波長必須短於或等於臨界波長才能提供足夠大的單光子能量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"德布羅意物質波","formula":"\\lambda=\\frac hp","vars":"粒子具有波動性。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>既然光同時表現出波與粒子性，德布羅意提出對稱性的假設：具有動量的物質粒子也應對應一個波長。</li><li>對光子而言，已知 $p=h/\\lambda$。德布羅意把這個關係推廣到物質粒子。</li><li>解出波長得到 $\\lambda=h/p$。</li><li>這個式子不是說物質真的像水波一樣把空間填滿，而是量子力學中「粒子的波動性」以波長尺度呈現，並可透過電子繞射與干涉觀察。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這裡的 $\\lambda=h/p$ 是量子態的特徵波長，不應把它理解成粒子本身外面真的套著一條經典波。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"德布羅意物質波（非相對論）","formula":"\\lambda=\\frac{h}{mv}","vars":"低速粒子使用 $p=mv$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>從德布羅意關係 $\\lambda=h/p$ 出發。</li><li>對低速、非相對論粒子，可以使用經典動量 $p=mv$。</li><li>代入得到 $\\lambda=h/(mv)$。</li><li>當粒子速度很高、接近光速時，$p=mv$ 不再是精確的相對論表示，就不能直接套這個非相對論形式。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"質能等價","formula":"E=mc^2","vars":"狹義相對論的質能關係。","note":"","reasoning":"<div class=\"rounded-lg bg-blue-50/60 dark:bg-slate-900/40 border border-blue-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">先辨認公式性質：</b> 這裡的式子在高中物理裡主要作為定義或基本定律使用。真正的「推導」不是再硬找一條更前面的代數式，而是說明這個量為什麼這樣定義、它描述什麼物理關係，以及在什麼條件下可以拿來往下推。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>狹義相對論的能量—動量關係在粒子靜止時可得到靜止能量項。</li><li>對靜止粒子，動量為零，因此總能量不是零，而是與質量成正比。</li><li>比例常數為真空光速平方，因此得到 $E=mc^2$。</li><li>在核反應中真正關心的通常是能量差 $\\Delta E=\\Delta mc^2$；當系統總靜止質量減少時，差額可以出現在其他形式的能量中。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>這張卡的公式在高中層級主要是「定義式／基本定律」，因此重點不是再往下硬湊一條公式，而是理解它定義了什麼量、採用了什麼符號與正負方向，以及它與後續公式的連結。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"質量虧損與能量","formula":"\\Delta E=\\Delta mc^2","vars":"質量差可對應能量差。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>若一個封閉系統反應前後的靜止質量不同，狹義相對論指出靜止能量也會改變。</li><li>由質能關係 $E=mc^2$，反應前後相減得到 $\\Delta E=\\Delta mc^2$。</li><li>若定義質量虧損 $\\Delta m=m_{\\rm initial}-m_{\\rm final}>0$，那麼系統釋放出的能量可表示為 $\\Delta E=\\Delta mc^2$。</li><li>因此核融合、核分裂等反應中，即使質量差非常小，也可能對應巨大的能量，因為 $c^2$ 很大。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"波耳角動量量子化","formula":"mvr=n\\hbar","vars":"<b>$\\hbar=h/(2\\pi)$</b>","note":"波耳模型的離散角動量條件。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>波耳模型要求電子只能存在於特定的穩定軌道，而不是任意半徑。</li><li>波耳提出軌道角動量必須是約化普朗克常數的整數倍。</li><li>質量為 $m$、速度為 $v$、半徑為 $r$ 的圓周運動角動量是 $L=mvr$，因此條件寫成 $mvr=n\\hbar$。</li><li>其中 $\\hbar=h/(2\\pi)$。這是舊量子論的量子化條件，現代量子力學以更完整的量子態描述取代了經典軌道圖像。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>波耳模型的離散角動量條件。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"波耳半徑","formula":"r_n=n^2a_0","vars":"<b>$a_0$</b>：波耳半徑","note":"氫原子允許軌道半徑與 $n^2$ 成正比。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>在波耳氫原子模型中，電子受庫侖吸引力提供圓周運動向心力：$ke^2/r^2=mv^2/r$。</li><li>再配合角動量量子化 $mvr=n\\hbar$。從第二式得到 $v=n\\hbar/(mr)$。</li><li>把 $v$ 代入第一式並整理，可得到半徑與 $n^2$ 成正比：$r_n=n^2a_0$。</li><li>其中 $a_0$ 是基態 $n=1$ 的波耳半徑。這個結果來自波耳模型的兩個核心假設，而非單靠幾何比例猜出來。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>氫原子允許軌道半徑與 $n^2$ 成正比。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"氫原子能階","formula":"E_n=-\\frac{13.6}{n^2}\\ {\\rm eV}","vars":"$n=1,2,3,\\ldots$","note":"氫原子離散能階。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>波耳模型中電子的總能量等於動能加庫侖位能：$E=\\frac12mv^2-ke^2/r$。</li><li>由圓周條件 $ke^2/r^2=mv^2/r$，可得 $\\frac12mv^2=ke^2/(2r)$。</li><li>因此總能量 $E=ke^2/(2r)-ke^2/r=-ke^2/(2r)$。再代入允許軌道 $r_n=n^2a_0$，可得 $E_n\\propto-1/n^2$。</li><li>對氫原子的常數代入後，得到 $E_n=-13.6/n^2\\,{\\rm eV}$。負號表示電子處於束縛態；$E=0$ 對應游離極限。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>負能量代表電子被束縛在原子中；越接近 $0$，表示電子越接近游離。當 $n\to\\infty$，$E_n\to0$，就是連續能階的游離極限。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>氫原子離散能階。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"能階躍遷與光子","formula":"hf=|\\Delta E|","vars":"能階差由光子能量承接。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>原子只能處於離散能階，因此從初態 $E_i$ 跳到末態 $E_f$ 時，系統能量改變不是任意值。</li><li>若能量差以光子形式放出或吸收，能量守恆要求光子能量等於能階差的大小。</li><li>光子能量為 $hf$，因此 $hf=|E_f-E_i|=|\\Delta E|$。</li><li>向低能階躍遷時原子放出光子；向高能階躍遷時則需要吸收相應能量的光子。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"能階躍遷與波長","formula":"\\frac{hc}{\\lambda}=|\\Delta E|","vars":"用光子能量的波長形式表示。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由能階躍遷的能量守恆，光子能量滿足 $hf=|\\Delta E|$。</li><li>真空光的頻率與波長關係為 $f=c/\\lambda$。</li><li>因此 $h(c/\\lambda)=|\\Delta E|$。</li><li>得到 $hc/\\lambda=|\\Delta E|$。這說明能階差越大，放出的光子頻率越高、波長越短。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"氫光譜 Rydberg 公式","formula":"\\frac1\\lambda=R_H\\left(\\frac1{n_f^2}-\\frac1{n_i^2}\\right)","vars":"$n_i>n_f$","note":"由氫原子離散能階得到光譜線。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>氫原子能階為 $E_n=-13.6/n^2\\,{\\rm eV}$。當電子由 $n_i$ 跳到較低的 $n_f$ 時，放出光子。</li><li>光子能量等於兩能階差：$hc/\\lambda=13.6\\left(1/n_f^2-1/n_i^2\\right){\\rm eV}$。</li><li>把常數與單位換成波數形式，可以把 $13.6\\,{\\rm eV}/(hc)$ 合併成氫原子 Rydberg 常數 $R_H$。</li><li>因此得到 $1/\\lambda=R_H(1/n_f^2-1/n_i^2)$，其中 $n_i>n_f$ 對應發射光譜。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>由氫原子離散能階得到光譜線。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"X 射線最大頻率","formula":"eV=hf_{\\max}","vars":"電子加速動能全部轉成單一光子時達最大頻率。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>X 射線管中的電子經電位差 $V$ 加速，理想情況下每個電子增加的動能為 $eV$。</li><li>若某次碰撞中這個電子的全部動能都轉成「一個」X 射線光子的能量，就得到單一光子能量的最大值。</li><li>因此 $eV=hf_{\\max}$。</li><li>實際X射線還有連續譜與特徵譜線，但最短波長／最大頻率的截止位置由這個能量守恆條件決定。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"X 射線最短波長","formula":"\\lambda_{\\min}=\\frac{hc}{eV}","vars":"由 $E=hc/\\lambda$。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由截止條件 $eV=hf_{\\max}$ 出發。</li><li>光子能量也可寫成 $E=hc/\\lambda$。在最大頻率時波長最短。</li><li>因此 $eV=hc/\\lambda_{\\min}$。</li><li>解得 $\\lambda_{\\min}=hc/(eV)$。管電壓越高，電子能量越大，所以可以產生更短波長的 X 射線。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"放射性衰變定律","formula":"N=N_0e^{-\\lambda t}","vars":"<b>$\\lambda$</b>：衰變常數","note":"剩餘核數以指數衰減。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>放射性衰變具有「每個尚未衰變核在單位時間內以固定機率衰變」的特性。</li><li>因此在一小段時間 $dt$ 內，衰減的核數與目前剩餘核數 $N$ 成正比：$dN=-\\lambda Ndt$。</li><li>整理為 $dN/N=-\\lambda dt$，從初始狀態 $N_0$ 到時間 $t$ 積分，得到 $\\ln(N/N_0)=-\\lambda t$。</li><li>取指數後得到 $N=N_0e^{-\\lambda t}$。負號表示剩餘核數隨時間單調下降。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>指數衰變來自「每顆尚未衰變的核，在單位時間內有固定衰變機率」。因此衰變速率與當下剩餘核數成正比，而不是與最初核數固定成正比。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>剩餘核數以指數衰減。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"放射性活度","formula":"A=\\lambda N","vars":"單位時間衰變數。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>活度定義為單位時間內發生的放射性衰變數，也就是衰變速率的大小。</li><li>由放射性微分方程 $dN/dt=-\\lambda N$，衰變速率的大小為 $-dN/dt=\\lambda N$。</li><li>因此 $A=\\lambda N$。</li><li>單位通常是 Bq（貝克勒），即每秒一次衰變；活度越高表示單位時間發生的衰變越多。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"活度隨時間衰減","formula":"A=A_0e^{-\\lambda t}","vars":"由活度與剩餘核數關係得到。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由活度定義 $A=\\lambda N$，而衰變常數 $\\lambda$ 對同一放射性核種固定。</li><li>代入剩餘核數 $N=N_0e^{-\\lambda t}$。</li><li>得到 $A=\\lambda N_0e^{-\\lambda t}$。</li><li>因 $A_0=\\lambda N_0$，所以可整理成 $A=A_0e^{-\\lambda t}$。也就是活度與剩餘核數具有相同的指數衰減時間尺度。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"半衰期","formula":"T_{1/2}=\\frac{\\ln2}{\\lambda}","vars":"剩餘量變成一半的時間。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>半衰期 $T_{1/2}$ 定義為剩餘核數降為原來一半所需的時間。</li><li>從衰變律 $N=N_0e^{-\\lambda t}$ 出發，在 $t=T_{1/2}$ 時令 $N=N_0/2$。</li><li>得到 $1/2=e^{-\\lambda T_{1/2}}$。兩邊取自然對數：$\\ln2=-\\ln(e)\\lambda T_{1/2}$，即 $\\ln2=\\lambda T_{1/2}$。</li><li>因此 $T_{1/2}=\\ln2/\\lambda$。半衰期是固定的，而不是每衰變一次就重新計時。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"半衰期形式的衰變律","formula":"N=N_0\\left(\\frac12\\right)^{t/T_{1/2}}","vars":"把指數衰變以半衰期表示。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>由半衰期關係 $T_{1/2}=\\ln2/\\lambda$，得到 $\\lambda=\\ln2/T_{1/2}$。</li><li>把這個結果代回指數衰變律：$N=N_0e^{-(\\ln2)t/T_{1/2}}$。</li><li>利用 $e^{\\ln2}=2$，可把指數寫成 $N=N_0(1/2)^{t/T_{1/2}}$。</li><li>這個形式很適合處理「經過幾個半衰期」的題目，例如經過 $n$ 個半衰期後剩下 $(1/2)^n$。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"平均壽命","formula":"\\tau=\\frac1\\lambda","vars":"指數衰變的平均壽命。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>對指數衰變 $N=N_0e^{-\\lambda t}$，衰變時間分布具有固定的指數尺度。</li><li>指數分布的平均壽命，也就是一個不穩定核從形成到衰變的平均時間尺度，等於衰變常數的倒數。</li><li>因此 $\\tau=1/\\lambda$。</li><li>與半衰期比較可得 $T_{1/2}=\\tau\\ln2$；所以平均壽命與半衰期不是同一個定義，但由同一個衰變常數決定。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"核結合能","formula":"E_b=\\Delta mc^2","vars":"質量虧損對應結合能。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>把自由質子與中子組合成原子核時，形成的束縛系統總質量通常小於分開核子質量總和。這個差稱為質量虧損。</li><li>由質能關係，質量差對應一個能量差 $\\Delta mc^2$。</li><li>形成原子核時這部分能量以束縛能的形式釋放；反過來，要把原子核完全拆成自由核子，就必須輸入同樣的能量。</li><li>因此核結合能 $E_b=\\Delta mc^2$。結合能越大，一般表示核子整體受到的束縛越強，但實際穩定性還需看每核子結合能等因素。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"每核子平均結合能","formula":"\\frac{E_b}{A}","vars":"<b>$A$</b>：質量數","note":"用結合能除以核子數。","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>原子核總結合能 $E_b$ 是所有核子共同形成束縛狀態所對應的總能量尺度。</li><li>若想比較不同大小原子核的束縛程度，可以除以核子總數，即質量數 $A$。</li><li>因此每核子平均結合能定義為 $E_b/A$。</li><li>它不是新的能量守恆定律，而是一個比較不同原子核的重要指標；通常比較的是每個核子平均分攤到的結合能。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>用結合能除以核子數。</div></div></div>"},{"cat":"modern","label":"近代物理","title":"質量單位的質能換算","formula":"1\\,u\\,c^2\\approx931.5\\ {\\rm MeV}","vars":"核物理常用換算。","note":"","reasoning":"<div class=\"rounded-lg bg-emerald-50/60 dark:bg-slate-900/40 border border-emerald-100 dark:border-slate-700 p-3 mb-3\"><b class=\"text-slate-800 dark:text-slate-200\">推導起點：</b> 近代物理的公式通常連接「量子化」與「能量守恆」。推導時要先指出模型或假設，例如光子、德布羅意物質波、波耳模型或放射性衰變的機率模型，再進行代入整理。</div><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">一步一步推導</div><ol class=\"list-decimal list-inside space-y-2 leading-relaxed\"><li>原子核物理常用原子質量單位 $u$ 表示微觀質量，因為直接用公斤會非常不方便。</li><li>由質能等價式，一個質量單位所對應的能量為 $1u\\times c^2$。</li><li>把 $1u$ 的 SI 質量值與 $c$ 代入，再把焦耳換算成電子伏特，得到約 $931.5\\,{\\rm MeV}$。</li><li>因此核物理中常把質量虧損以 $u$ 表示，再直接乘上 $931.5\\,{\\rm MeV}/u$ 快速換算成對應的能量。</li></ol><div class=\"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3\"><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">物理意義</div><div>完成推導後，可以把這個結果視為前面基本關係的壓縮版本：題目中真正需要判斷的是「哪些條件成立、哪些量已知、哪一個基本關係最適合作為出發點」，而不是看到公式就直接代數字。</div></div><div class=\"rounded-lg bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-700 p-3\"><div class=\"font-bold text-slate-700 dark:text-slate-200 mb-1\">適用條件／注意</div><div>先確認使用的是哪個模型與近似，例如非相對論、光子模型、波耳模型或指數衰變模型；不同模型的適用範圍不可混用。</div></div></div>"}];

            car: `
                <div class="mb-4">
                    <div class="text-xs font-semibold mb-2 text-slate-500">🎬 動態視覺示範（小車等加速度運動）</div>
                    <canvas id="carCanvas" class="w-full h-32 bg-slate-100 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700"></canvas>
                    <div class="flex justify-end gap-2 mt-2">
                        <button onclick="toggleCarAnimation()" class="text-xs bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">播放 / 暫停</button>
                        <button onclick="resetCarAnimation()" class="text-xs bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1 rounded hover:bg-slate-300">重置</button>
                    </div>
                </div>`,
            vt: `
                <div class="mb-4">
                    <div class="text-xs font-semibold mb-2 text-slate-500">🎬 動態視覺示範（v-t 圖面積 = 位移）</div>
                    <canvas id="vtCanvas" class="w-full h-36 bg-slate-100 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700"></canvas>
                    <div class="flex justify-end gap-2 mt-2">
                        <button onclick="toggleVTAnimation()" class="text-xs bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">播放 / 暫停</button>
                        <button onclick="resetVTAnimation()" class="text-xs bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1 rounded hover:bg-slate-300">重置</button>
                    </div>
                </div>`,
            newton: `
                <div class="mb-4">
                    <div class="text-xs font-semibold mb-2 text-slate-500">🎬 動態視覺示範（相同推力下的加速度比較）</div>
                    <canvas id="newtonCanvas" class="w-full h-36 bg-slate-100 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700"></canvas>
                    <div class="flex justify-end gap-2 mt-2">
                        <button onclick="toggleNewtonAnimation()" class="text-xs bg-emerald-600 text-white px-3 py-1 rounded hover:bg-emerald-700">播放 / 暫停</button>
                        <button onclick="resetNewtonAnimation()" class="text-xs bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1 rounded hover:bg-slate-300">重置比較</button>
                    </div>
                </div>`
        };

        let activeCategory = "all";
        let searchTerm = "";

        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function matchesSearch(item) {
            if (!searchTerm) return true;
            const haystack = [item.title, item.label, item.formula, item.vars, item.note, item.reasoning]
                .join(" ")
                .toLowerCase();
            return haystack.includes(searchTerm.toLowerCase());
        }

        function getVisibleFormulas() {
            return FORMULAS.filter(item =>
                (activeCategory === "all" || item.cat === activeCategory) &&
                matchesSearch(item)
            );
        }

        function renderCards() {
            const grid = document.getElementById("formulaGrid");
            const empty = document.getElementById("emptyState");
            const visible = getVisibleFormulas();

            document.getElementById("formulaCount").textContent = FORMULAS.length;
            document.getElementById("visibleCount").textContent = visible.length;

            grid.innerHTML = visible.map((item) => {
                const style = CATEGORY_STYLES[item.cat] || CATEGORY_STYLES.measurement;
                const number = String(FORMULAS.indexOf(item) + 1).padStart(3, "0");
                const demo = item.demo ? DEMO_HTML[item.demo] : "";
                return `
                    <article class="card ${item.cat} bg-white dark:bg-slate-800 rounded-xl p-6 border ${style.border} shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start mb-3 gap-3">
                            <span class="text-xs font-semibold ${style.badge} px-2.5 py-1 rounded-md">${escapeHTML(item.label)}</span>
                            <span class="text-xs text-slate-400 shrink-0">公式 ${number}</span>
                        </div>

                        <h2 class="text-lg font-bold mb-2">${escapeHTML(item.title)}</h2>

                        <div class="my-4 py-3 bg-slate-50 dark:bg-slate-900/50 rounded-lg text-center border border-slate-100 dark:border-slate-800 overflow-x-auto">
                            $$${item.formula}$$
                        </div>

                        ${item.vars ? `
                        <div class="text-xs text-slate-600 dark:text-slate-400 space-y-1 mb-3 bg-slate-50/50 dark:bg-slate-900/30 p-3 rounded-lg leading-relaxed">
                            ${item.vars}
                        </div>` : ""}

                        ${item.note ? `
                        <div class="text-xs text-slate-500 dark:text-slate-400 mb-4 rounded-lg border border-dashed border-slate-200 dark:border-slate-700 px-3 py-2 leading-relaxed">
                            <b class="text-slate-700 dark:text-slate-300">適用條件／補充：</b> ${item.note}
                        </div>` : ""}

                        ${demo}

                        <div class="border-t border-slate-100 dark:border-slate-700/60 pt-4">
                            <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">💡 詳細推導與物理意義</h3>
                            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">${item.reasoning}</p>
                        </div>
                    </article>`;
            }).join("");

            empty.classList.toggle("hidden", visible.length !== 0);

            renderMathInElement(document.getElementById("formulaGrid"), {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError: false
            });

            initAllAnimations();
        }

        function setActiveButton() {
            document.querySelectorAll(".filter-btn").forEach(btn => {
                const isActive = btn.dataset.category === activeCategory;
                btn.classList.toggle("bg-blue-600", isActive);
                btn.classList.toggle("text-white", isActive);
                if (!isActive) {
                    btn.classList.add("bg-slate-200", "dark:bg-slate-800", "text-slate-600", "dark:text-slate-400");
                } else {
                    btn.classList.remove("bg-slate-200", "dark:bg-slate-800", "text-slate-600", "dark:text-slate-400");
                }
            });
        }

        function filterCards(category, btnElement) {
            activeCategory = category;
            setActiveButton();
            renderCards();
        }

        document.getElementById("filterBar").addEventListener("click", (event) => {
            const btn = event.target.closest(".filter-btn");
            if (!btn) return;
            filterCards(btn.dataset.category, btn);
        });

        document.getElementById("searchInput").addEventListener("input", (event) => {
            searchTerm = event.target.value.trim();
            renderCards();
        });

        // 深色模式
        const themeToggleBtn = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        themeToggleBtn.addEventListener("click", () => {
            const html = document.documentElement;
            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                themeIcon.textContent = "🌙";
            } else {
                html.classList.add("dark");
                themeIcon.textContent = "☀️";
            }
            initAllAnimations();
        });

        // --- 動畫 1：等加速度小車 ---
        let carX = 10, carV = 0, carA = 0.12, carAnimId = null, isCarRunning = false;
        function initCarAnimation() {
            const canvas = document.getElementById("carCanvas");
            if (!canvas) return;
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = canvas.offsetHeight || 128;
            drawCarFrame(canvas.getContext("2d"), canvas);
        }
        function drawCarFrame(ctx, canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, canvas.height - 25); ctx.lineTo(canvas.width, canvas.height - 25); ctx.stroke();
            ctx.fillStyle = "#3b82f6"; ctx.fillRect(carX, canvas.height - 45, 35, 18);
            ctx.fillStyle = "#1e293b";
            ctx.beginPath();
            ctx.arc(carX + 8, canvas.height - 25, 5, 0, Math.PI * 2);
            ctx.arc(carX + 27, canvas.height - 25, 5, 0, Math.PI * 2);
            ctx.fill();
            const isDark = document.documentElement.classList.contains("dark");
            ctx.fillStyle = isDark ? "#cbd5e1" : "#334155"; ctx.font = "12px sans-serif";
            ctx.fillText(`速度 v: ${(carV * 10).toFixed(1)} m/s`, 12, 22);
            ctx.fillText("加速度 a: 1.2 m/s²", 130, 22);
        }
        function toggleCarAnimation() {
            if (isCarRunning) { cancelAnimationFrame(carAnimId); isCarRunning = false; }
            else { isCarRunning = true; runCarAnimation(); }
        }
        function runCarAnimation() {
            if (!isCarRunning) return;
            const canvas = document.getElementById("carCanvas");
            if (!canvas) return;
            carV += carA; carX += carV;
            if (carX > canvas.width - 45) { carX = 10; carV = 0; }
            drawCarFrame(canvas.getContext("2d"), canvas);
            carAnimId = requestAnimationFrame(runCarAnimation);
        }
        function resetCarAnimation() {
            cancelAnimationFrame(carAnimId); isCarRunning = false; carX = 10; carV = 0; initCarAnimation();
        }

        // --- 動畫 2：v-t 面積累積 ---
        let vtProgress = 0, vtAnimId = null, isVTRunning = false;
        function initVTAnimation() {
            const canvas = document.getElementById("vtCanvas");
            if (!canvas) return;
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = canvas.offsetHeight || 144;
            drawVTFrame(canvas.getContext("2d"), canvas);
        }
        function drawVTFrame(ctx, canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isDark = document.documentElement.classList.contains("dark");
            const textColor = isDark ? "#cbd5e1" : "#334155";
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(35, 15); ctx.lineTo(35, canvas.height - 25); ctx.lineTo(canvas.width - 15, canvas.height - 25);
            ctx.stroke();
            const startX = 35, startY = canvas.height - 25;
            const endX = startX + (canvas.width - 70) * (vtProgress / 100);
            const initialV = 30, finalV = 30 + (canvas.height - 70) * (vtProgress / 100);
            if (vtProgress > 0) {
                ctx.fillStyle = isDark ? "rgba(59, 130, 246, 0.4)" : "rgba(59, 130, 246, 0.25)";
                ctx.fillRect(startX, startY - initialV, endX - startX, initialV);
                ctx.fillStyle = isDark ? "rgba(16, 185, 129, 0.4)" : "rgba(16, 185, 129, 0.25)";
                ctx.beginPath();
                ctx.moveTo(startX, startY - initialV);
                ctx.lineTo(endX, startY - finalV);
                ctx.lineTo(endX, startY - initialV);
                ctx.fill();
                ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(startX, startY - initialV); ctx.lineTo(endX, startY - finalV); ctx.stroke();
            }
            ctx.fillStyle = textColor; ctx.font = "11px sans-serif";
            ctx.fillText("v (速度)", 5, 15); ctx.fillText("t (時間)", canvas.width - 45, canvas.height - 8);
            ctx.fillText("v₀ (初速)", 2, startY - initialV + 4);
            if (vtProgress > 20) {
                ctx.fillStyle = isDark ? "#93c5fd" : "#1d4ed8";
                ctx.fillText("矩形: v₀t", startX + 10, startY - 10);
            }
            if (vtProgress > 50) {
                ctx.fillStyle = isDark ? "#6ee7b7" : "#047857";
                ctx.fillText("三角形: ½at²", startX + (endX - startX) * 0.4, startY - initialV - 8);
            }
        }
        function toggleVTAnimation() {
            if (isVTRunning) { cancelAnimationFrame(vtAnimId); isVTRunning = false; }
            else { isVTRunning = true; runVTAnimation(); }
        }
        function runVTAnimation() {
            if (!isVTRunning) return;
            const canvas = document.getElementById("vtCanvas");
            if (!canvas) return;
            vtProgress += 0.8;
            if (vtProgress > 100) vtProgress = 100;
            drawVTFrame(canvas.getContext("2d"), canvas);
            if (vtProgress < 100) { vtAnimId = requestAnimationFrame(runVTAnimation); }
            else { isVTRunning = false; }
        }
        function resetVTAnimation() {
            cancelAnimationFrame(vtAnimId); isVTRunning = false; vtProgress = 0; initVTAnimation();
        }

        // --- 動畫 3：牛頓第二定律對比 ---
        let nX1 = 10, nX2 = 10, nV1 = 0, nV2 = 0, newtonAnimId = null, isNewtonRunning = false;
        const mA = 2, mB = 6, Fdemo = 10;
        const aA = Fdemo / mA * 0.03, aB = Fdemo / mB * 0.03;
        function initNewtonAnimation() {
            const canvas = document.getElementById("newtonCanvas");
            if (!canvas) return;
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = canvas.offsetHeight || 144;
            drawNewtonFrame(canvas.getContext("2d"), canvas);
        }
        function drawNewtonFrame(ctx, canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isDark = document.documentElement.classList.contains("dark");
            const textColor = isDark ? "#cbd5e1" : "#334155";
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, 55); ctx.lineTo(canvas.width, 55); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 115); ctx.lineTo(canvas.width, 115); ctx.stroke();
            ctx.fillStyle = "#10b981"; ctx.fillRect(nX1, 30, 25, 25);
            ctx.fillStyle = "#f59e0b"; ctx.fillRect(nX2, 80, 35, 35);
            drawArrow(ctx, nX1 + 25, 42.5, 30, "#ef4444");
            drawArrow(ctx, nX2 + 35, 97.5, 30, "#ef4444");
            ctx.fillStyle = textColor; ctx.font = "11px sans-serif";
            ctx.fillText("輕物 m = 2 kg ｜ F = 10 N ｜ a = 5.0 m/s²", 10, 20);
            ctx.fillText("重物 m = 6 kg ｜ F = 10 N ｜ a = 1.7 m/s²", 10, 72);
        }
        function drawArrow(ctx, fromx, fromy, length, color) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(fromx, fromy); ctx.lineTo(fromx + length, fromy); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(fromx + length, fromy);
            ctx.lineTo(fromx + length - 5, fromy - 4);
            ctx.lineTo(fromx + length - 5, fromy + 4);
            ctx.fill();
        }
        function toggleNewtonAnimation() {
            if (isNewtonRunning) { cancelAnimationFrame(newtonAnimId); isNewtonRunning = false; }
            else { isNewtonRunning = true; runNewtonAnimation(); }
        }
        function runNewtonAnimation() {
            if (!isNewtonRunning) return;
            const canvas = document.getElementById("newtonCanvas");
            if (!canvas) return;
            nV1 += aA; nX1 += nV1; nV2 += aB; nX2 += nV2;
            if (nX1 > canvas.width - 60 && nX2 > canvas.width - 70) { isNewtonRunning = false; return; }
            drawNewtonFrame(canvas.getContext("2d"), canvas);
            newtonAnimId = requestAnimationFrame(runNewtonAnimation);
        }
        function resetNewtonAnimation() {
            cancelAnimationFrame(newtonAnimId); isNewtonRunning = false;
            nX1 = 10; nX2 = 10; nV1 = 0; nV2 = 0; initNewtonAnimation();
        }

        function initAllAnimations() {
            resetCarAnimation();
            resetVTAnimation();
            resetNewtonAnimation();
        }

        window.addEventListener("load", () => {
            renderCards();
            initAllAnimations();
        });

        window.addEventListener("resize", () => {
            if (document.getElementById("carCanvas")) resetCarAnimation();
            if (document.getElementById("vtCanvas")) resetVTAnimation();
            if (document.getElementById("newtonCanvas")) resetNewtonAnimation();
        });
    </script>
</body>

</html>
